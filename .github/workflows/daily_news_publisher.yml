name: Daily Global Market News Publisher

on:
  schedule:
    # Runs at 00:00 UTC (07:00 AM Vietnam Time) every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual 1-click execution from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish-daily-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv requests

      - name: Run Auto News Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ai_agent/auto_news_publisher.py

      - name: Commit and Push New Article to GitHub Pages
        run: |
          git config --global user.name "PTvolume Auto Publisher"
          git config --global user.email "bot@ptvolume.com"
          git add posts/ index.html
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-Publish: Daily Global Market Intelligence [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
