<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" /><stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" /><stop offset="100%" stop-color="#10141D" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg4)" />
  <rect x="80" y="35" width="240" height="28" rx="14" fill="rgba(38, 231, 166, 0.12)" stroke="rgba(38, 231, 166, 0.35)" />
  <text x="200" y="54" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">PHƯƠNG PHÁP WYCKOFF • BÀI 4</text>
  <text x="80" y="95" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Săn Siêu Cổ Phiếu Bằng Sức Mạnh Tương Đối (RS) &amp; Đi Tiền Kim Tự Tháp</text>
  <text x="80" y="120" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Công thức so sánh cổ phiếu với chỉ số thị trường chung và chiến lược giải ngân 3 bước an toàn</text>

  <!-- Left: RS Comparison -->
  <g transform="translate(80, 150)">
    <rect width="530" height="490" rx="12" fill="url(#card4)" stroke="rgba(38, 231, 166, 0.3)" stroke-width="1.5" />
    <rect width="530" height="50" rx="12" fill="rgba(38, 231, 166, 0.08)" />
    <text x="24" y="32" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="16" font-weight="700">1. Nhận Diện Cổ Phiếu Dẫn Dắt Qua Sức Mạnh RS</text>

    <g transform="translate(24, 75)">
      <rect width="482" height="120" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="26" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Tình huống 1: Khi Thị Trường Chung (Index) Giảm Đáy Mới</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Cổ phiếu yếu: Rơi tự do sâu hơn cả thị trường chung.</text>
      <text x="18" y="74" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13" font-weight="700">• Siêu cổ phiếu: Giữ vững đáy cũ hoặc tạo đáy sau cao hơn (Higher Low)!</text>
      <text x="18" y="98" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12.5">Dấu hiệu Smart Money đang tích cực kê lệnh đỡ giá không cho rơi.</text>
    </g>

    <g transform="translate(24, 215)">
      <rect width="482" height="120" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="26" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Tình huống 2: Khi Thị Trường Chung Bắt Đầu Hồi Phục Đi Ngang</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Cổ phiếu bình thường: Lóp ngóp hồi nhẹ yếu ớt dưới đáy.</text>
      <text x="18" y="74" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">• Siêu cổ phiếu: Bứt phá vượt đỉnh (Breakout) đầu tiên kèm Volume lớn!</text>
      <text x="18" y="98" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12.5">Nhóm ngành dẫn dắt luôn bùng nổ trước khi Index chính thức tạo đáy.</text>
    </g>

    <g transform="translate(24, 355)">
      <rect width="482" height="110" rx="8" fill="rgba(38, 231, 166, 0.05)" stroke="rgba(38, 231, 166, 0.25)" />
      <text x="18" y="28" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">🏆 Bí Kíp Lựa Chọn Siêu Cổ Của Wyckoff:</text>
      <text x="18" y="55" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">"Hãy tìm kiếm cổ phiếu từ chối giảm giá khi toàn bộ thị trường đỏ lửa.</text>
      <text x="18" y="77" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">Đó chính là con ngựa chiến sẽ phi nhanh nhất khi bão tố qua đi!"</text>
    </g>
  </g>

  <!-- Right: Pyramid Position Sizing -->
  <g transform="translate(670, 150)">
    <rect width="530" height="490" rx="12" fill="url(#card4)" stroke="rgba(240, 185, 11, 0.3)" stroke-width="1.5" />
    <rect width="530" height="50" rx="12" fill="rgba(240, 185, 11, 0.08)" />
    <text x="24" y="32" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="16" font-weight="700">2. Phương Pháp Giải Ngân Kim Tự Tháp 3 Bước</text>

    <!-- Step 1 -->
    <g transform="translate(24, 75)">
      <rect width="482" height="95" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="26" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700">Đợt 1: Thăm Dò 30% Vị Thế (Tại Spring / Test Hỗ Trợ)</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13.5">• Giải ngân khi xuất hiện nến Test cạn cung tại hỗ trợ.</text>
      <text x="18" y="74" fill="#FF707E" font-family="'Inter', sans-serif" font-size="13">• Cắt lỗ cực ngắn ngay dưới đáy thấp nhất của Spring.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 185)">
      <rect width="482" height="95" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="26" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700">Đợt 2: Gia Tăng 40% Vị Thế (Khi Xuất Hiện Tín Hiệu SOS)</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13.5">• Chỉ mua khi đợt 1 ĐÃ CÓ LÃI và giá tạo nến bứt phá mạnh.</text>
      <text x="18" y="74" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13">• Dời toàn bộ Stop Loss của đợt 1 lên điểm hòa vốn (Break-even).</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 295)">
      <rect width="482" height="95" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="26" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700">Đợt 3: Mua Đủ 30% Cuối Cùng (Tại Nhịp Retest Vượt Cản JAC)</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13.5">• Mua khi giá kiểm tra lại ngưỡng kháng cự vừa bị phá vỡ (LPS/BUEC).</text>
      <text x="18" y="74" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13">• Hoàn tất vị thế 100% với lợi thế giá vốn an toàn tuyệt đối!</text>
    </g>

    <g transform="translate(24, 405)">
      <rect width="482" height="60" rx="8" fill="rgba(240, 185, 11, 0.06)" stroke="rgba(240, 185, 11, 0.25)" />
      <text x="18" y="28" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Nguyên Tắc Bất Di Bất Dịch:</text>
      <text x="18" y="48" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12.5">Tuyệt đối không bao giờ bình quân giá xuống (DCA lỗ) khi đang dự đoán sai!</text>
    </g>
  </g>

  <!-- Watermark -->
  <g transform="translate(1080, 675)">
    <rect width="125" height="26" rx="6" fill="rgba(11, 14, 20, 0.85)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="62" y="17" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">PTvolume.com</text>
  </g>
</svg>