<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-math" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
    <filter id="math-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" fill="url(#bg-math)" rx="14"/>
  <rect width="916" height="476" x="2" y="2" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <g transform="translate(460, 40)" text-anchor="middle">
    <rect x="-350" y="-20" width="700" height="40" rx="20" fill="#1A2130" stroke="rgba(240, 185, 11, 0.4)" stroke-width="1.2"/>
    <text y="5" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#F0B90B" letter-spacing="1">
      BẢNG MA TRẬN TOÁN HỌC GIAO DỊCH &amp; PHỤC HỒI THUA LỖ (TRADING MATH)
    </text>
    <text y="32" font-family="'Inter', sans-serif" font-size="12" fill="#8E9BAE">
      Toán học không biết nói dối: Bản chất sinh tồn của một Nhà Vô Địch Đầu Tư
    </text>
  </g>

  <!-- Left Table: The Asymmetry of Drawdown Recovery -->
  <g transform="translate(50, 95)" filter="url(#math-shadow)">
    <rect width="385" height="300" rx="10" fill="#141822" stroke="#F23645" stroke-width="1.2"/>
    <rect width="385" height="38" rx="10" fill="#29161B"/>
    <path d="M 0 28 L 0 38 L 385 38 L 385 28 Z" fill="#29161B"/>
    <text x="192" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FF5252" text-anchor="middle">
      TOÁN HỌC PHỤC HỒI KHOẢN LỖ (DRAWDOWN)
    </text>

    <!-- Table Header -->
    <g transform="translate(15, 55)">
      <rect width="355" height="26" fill="#1B2230" rx="4"/>
      <text x="15" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8E9BAE">Mức Lỗ Vốn (%)</text>
      <text x="160" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8E9BAE">Lãi Cần Để Hòa Vốn</text>
      <text x="295" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8E9BAE">Mức Độ</text>
    </g>

    <!-- Row 1: 5% -->
    <g transform="translate(15, 87)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#26A69A">-5%</text>
      <text x="160" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#26A69A">+5.26%</text>
      <text x="295" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#26A69A">An Toàn</text>
    </g>
    <line x1="25" y1="110" x2="360" y2="110" stroke="#222938"/>

    <!-- Row 2: 10% -->
    <g transform="translate(15, 117)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F0B90B">-10%</text>
      <text x="160" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F0B90B">+11.11%</text>
      <text x="295" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#F0B90B">Cho Phép</text>
    </g>
    <line x1="25" y1="140" x2="360" y2="140" stroke="#222938"/>

    <!-- Row 3: 20% -->
    <g transform="translate(15, 147)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#FF9800">-20%</text>
      <text x="160" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#FF9800">+25.00%</text>
      <text x="295" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FF9800">Cảnh Báo</text>
    </g>
    <line x1="25" y1="170" x2="360" y2="170" stroke="#222938"/>

    <!-- Row 4: 30% -->
    <g transform="translate(15, 177)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F23645">-30%</text>
      <text x="160" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F23645">+42.86%</text>
      <text x="295" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#F23645">Nguy Hiểm</text>
    </g>
    <line x1="25" y1="200" x2="360" y2="200" stroke="#222938"/>

    <!-- Row 5: 50% -->
    <g transform="translate(15, 207)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FF1744">-50%</text>
      <text x="160" y="15" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FF1744">+100.00%</text>
      <text x="295" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#FF1744">THẢM HỌA</text>
    </g>

    <!-- Bottom Note -->
    <rect x="15" y="245" width="355" height="42" rx="6" fill="#1B141A" stroke="rgba(242, 54, 69, 0.4)" stroke-width="1"/>
    <text x="192" y="262" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FF5252" text-anchor="middle">
      "Lỗ 50% tài khoản đòi hỏi bạn phải LÃI GẤP ĐÔI để về điểm xuất phát!"
    </text>
    <text x="192" y="277" font-family="'Inter', sans-serif" font-size="9.5" fill="#8E9BAE" text-anchor="middle">
      => Giữ mức cắt lỗ chặt (5-8%) là cách duy nhất để sống còn.
    </text>
  </g>

  <!-- Right Table: Win Rate vs Gain/Loss Matrix -->
  <g transform="translate(485, 95)" filter="url(#math-shadow)">
    <rect width="385" height="300" rx="10" fill="#141822" stroke="#00E5FF" stroke-width="1.2"/>
    <rect width="385" height="38" rx="10" fill="#132333"/>
    <path d="M 0 28 L 0 38 L 385 38 L 385 28 Z" fill="#132333"/>
    <text x="192" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#00E5FF" text-anchor="middle">
      MA TRẬN LỢI NHUẬN / RỦI RO (R:R MATRIX)
    </text>

    <!-- Table Header -->
    <g transform="translate(15, 55)">
      <rect width="355" height="26" fill="#1B2230" rx="4"/>
      <text x="15" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8E9BAE">Tỷ Lệ Thắng</text>
      <text x="135" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8E9BAE">Tỷ Lệ Lãi/Lỗ</text>
      <text x="260" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8E9BAE">Kỳ Vọng Lợi Nhuận</text>
    </g>

    <!-- Row 1: 30% Win rate -->
    <g transform="translate(15, 87)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#CAD4E0">30% Thắng</text>
      <text x="135" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#00E5FF">3 : 1 (15% / 5%)</text>
      <text x="260" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#26A69A">+1.00R / lệnh</text>
    </g>
    <line x1="25" y1="110" x2="360" y2="110" stroke="#222938"/>

    <!-- Row 2: 40% Win rate -->
    <g transform="translate(15, 117)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#CAD4E0">40% Thắng</text>
      <text x="135" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#00E5FF">2 : 1 (10% / 5%)</text>
      <text x="260" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#26A69A">+1.00R / lệnh</text>
    </g>
    <line x1="25" y1="140" x2="360" y2="140" stroke="#222938"/>

    <!-- Row 3: 50% Win rate -->
    <g transform="translate(15, 147)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#CAD4E0">50% Thắng</text>
      <text x="135" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#00E5FF">2 : 1 (12% / 6%)</text>
      <text x="260" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#00E5FF">+3.00R / lệnh (SIÊU LÃI)</text>
    </g>
    <line x1="25" y1="170" x2="360" y2="170" stroke="#222938"/>

    <!-- Row 4: 60% Win rate -->
    <g transform="translate(15, 177)">
      <text x="15" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#CAD4E0">60% Thắng</text>
      <text x="135" y="15" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#00E5FF">2 : 1 (14% / 7%)</text>
      <text x="260" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#F0B90B">+5.60R / lệnh (VÔ ĐỊCH)</text>
    </g>

    <!-- Bottom Note -->
    <rect x="15" y="215" width="355" height="72" rx="6" fill="#101926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
    <text x="192" y="235" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#00E5FF" text-anchor="middle">
      QUY TẮC TỐI THƯỢNG: CẮT LỖ ≤ 1/2 LÃI TRUNG BÌNH
    </text>
    <text x="192" y="255" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">
      Nếu mức lãi trung bình của bạn là 10%, Stop Loss KHÔNG ĐƯỢC > 5%.
    </text>
    <text x="192" y="272" font-family="'Inter', sans-serif" font-size="9.5" fill="#8E9BAE" text-anchor="middle">
      Nếu lãi trung bình giảm về 6%, Stop Loss phải hạ xuống 3%.
    </text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(50, 412)">
    <rect width="820" height="42" rx="8" fill="#1A2130" stroke="rgba(240, 185, 11, 0.5)" stroke-width="1.2"/>
    <text x="410" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#F0B90B" text-anchor="middle">
      "Bí mật của nhà vô địch không phải là đoán đúng mọi lúc, mà là mất ít nhất khi sai và ăn nhiều nhất khi đúng."
    </text>
  </g>

  <!-- Watermark -->
  <text x="880" y="470" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.25)" text-anchor="end">PTvolume.com</text>
</svg>
