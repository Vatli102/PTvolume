<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1200" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <linearGradient id="card-grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16233B" />
      <stop offset="100%" stop-color="#0D1524" />
    </linearGradient>
    <linearGradient id="card-grad-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282012" />
      <stop offset="100%" stop-color="#141009" />
    </linearGradient>
    <linearGradient id="card-grad-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E282E" />
      <stop offset="100%" stop-color="#071518" />
    </linearGradient>
    <linearGradient id="card-grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112922" />
      <stop offset="100%" stop-color="#091813" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="1200" fill="url(#bg-canvas)" rx="16"/>
  <rect width="912" height="1192" x="4" y="4" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(460, 44)" text-anchor="middle">
    <rect x="-420" y="-25" width="840" height="50" rx="25" fill="#141926" stroke="rgba(0, 229, 255, 0.5)" stroke-width="1.8"/>
    <text y="7" font-size="19" font-weight="800" fill="#00E5FF" letter-spacing="0.6">
      4 TRỤ CỘT "NHÀ ĐẦU TƯ THÔNG MINH" — BENJAMIN GRAHAM
    </text>
    <text y="42" font-size="13.5" fill="#8E9BAE">
      Đúc kết từ kiệt tác "The Intelligent Investor" • Bộ giáp tâm lý &amp; kỷ luật vốn
    </text>
  </g>

  <!-- ==================== ROW 1: 2 CARDS ==================== -->

  <!-- CARD 1: ĐẦU TƯ VS ĐẦU CƠ -->
  <g transform="translate(30, 110)" filter="url(#shadow)">
    <rect width="415" height="500" rx="14" fill="url(#card-grad-blue)" stroke="#2962FF" stroke-width="2"/>
    <rect width="415" height="50" rx="14" fill="#2962FF"/>
    <path d="M 0 35 L 0 50 L 415 50 L 415 35 Z" fill="#2962FF"/>
    <circle cx="26" cy="25" r="14" fill="#0B0E14"/>
    <text x="26" y="31" font-size="14.5" font-weight="900" fill="#00E5FF" text-anchor="middle">1</text>
    <text x="48" y="32" font-size="15" font-weight="800" fill="#FFFFFF">ĐẦU TƯ VS. ĐẦU CƠ</text>

    <!-- Content -->
    <text x="18" y="80" font-size="14.5" font-weight="700" fill="#00E5FF">Định nghĩa của Benjamin Graham:</text>
    
    <text x="18" y="108" font-size="13.8" fill="#CAD4E0">• <tspan fill="#FFF" font-weight="700">Đầu tư:</tspan> Phân tích kỹ lưỡng cơ bản,</text>
    <text x="30" y="130" font-size="13.8" fill="#CAD4E0">bảo toàn vốn gốc và sinh lời thỏa đáng.</text>
    
    <text x="18" y="160" font-size="13.8" fill="#CAD4E0">• <tspan fill="#F23645" font-weight="700">Đầu cơ:</tspan> Cược giá ngắn hạn, mong</text>
    <text x="30" y="182" font-size="13.8" fill="#CAD4E0">có người mua lại đắt hơn (Greater Fool).</text>

    <!-- Inner Highlight Box -->
    <rect x="16" y="206" width="383" height="270" rx="10" fill="#09101C" stroke="#1F3052" stroke-width="1.4"/>
    <rect x="16" y="206" width="383" height="34" rx="10" fill="#132038"/>
    <path d="M 16 226 L 16 240 L 399 240 L 399 226 Z" fill="#132038"/>
    <text x="28" y="229" font-size="13.5" font-weight="800" fill="#F0B90B">⚡ BÀI HỌC THỰC CHIẾN PTVOLUME:</text>

    <text x="26" y="266" font-size="13.8" fill="#CAD4E0">• Mua theo tin đồn, phím kèo là đánh bạc.</text>
    <text x="26" y="294" font-size="13.8" fill="#CAD4E0">• Trader VSA / Price Action cần tư duy</text>
    <text x="38" y="316" font-size="13.8" fill="#26E7A6" font-weight="600">như nhà đầu tư: Hiểu dòng tiền Smart Money</text>
    <text x="38" y="338" font-size="13.8" fill="#26E7A6" font-weight="600">và luôn đặt Stop Loss bảo vệ vốn.</text>
    <text x="26" y="368" font-size="13.8" fill="#CAD4E0">• Muốn lướt sóng: Hãy dùng quỹ nhỏ riêng,</text>
    <text x="38" y="390" font-size="13.8" fill="#FF5252" font-weight="600">tuyệt đối không lẫn lộn với quỹ tích sản!</text>

    <text x="207" y="445" font-size="12.8" fill="#8E9BAE" font-style="italic" text-anchor="middle">«Bảo toàn vốn gốc là điều kiện sống còn»</text>
  </g>

  <!-- CARD 2: NGÀI THỊ TRƯỜNG -->
  <g transform="translate(475, 110)" filter="url(#shadow)">
    <rect width="415" height="500" rx="14" fill="url(#card-grad-gold)" stroke="#F0B90B" stroke-width="2"/>
    <rect width="415" height="50" rx="14" fill="#F0B90B"/>
    <path d="M 0 35 L 0 50 L 415 50 L 415 35 Z" fill="#F0B90B"/>
    <circle cx="26" cy="25" r="14" fill="#0B0E14"/>
    <text x="26" y="31" font-size="14.5" font-weight="900" fill="#F0B90B" text-anchor="middle">2</text>
    <text x="48" y="32" font-size="15" font-weight="800" fill="#0B0E14">NGÀI THỊ TRƯỜNG (MR. MARKET)</text>

    <!-- Content -->
    <text x="18" y="80" font-size="14.5" font-weight="700" fill="#F0B90B">Bản chất của Ngài Thị Trường:</text>
    
    <text x="18" y="108" font-size="13.8" fill="#CAD4E0">• Đối tác kinh doanh thất thường, cực đoan:</text>
    <text x="30" y="130" font-size="13.8" fill="#CAD4E0">Hôm nay đòi giá trên trời; mai bán đổ bán tháo.</text>
    
    <text x="18" y="160" font-size="13.8" fill="#CAD4E0">• <tspan fill="#FFF" font-weight="700">Quy tắc vàng:</tspan> Là <tspan fill="#00E5FF" font-weight="700">người phục vụ bạn</tspan>,</text>
    <text x="30" y="182" font-size="13.8" fill="#CAD4E0">tuyệt đối KHÔNG phải người dẫn dắt bạn!</text>

    <!-- Inner Highlight Box -->
    <rect x="16" y="206" width="383" height="270" rx="10" fill="#141108" stroke="#3A2D10" stroke-width="1.4"/>
    <rect x="16" y="206" width="383" height="34" rx="10" fill="#261E0B"/>
    <path d="M 16 226 L 16 240 L 399 240 L 399 226 Z" fill="#261E0B"/>
    <text x="28" y="229" font-size="13.5" font-weight="800" fill="#F0B90B">⚡ ỨNG DỤNG THỊ TRƯỜNG HIỆN ĐẠI:</text>

    <text x="26" y="266" font-size="13.8" fill="#CAD4E0">• Bảng điện tử nhảy nhót không đổi giá trị.</text>
    <text x="26" y="294" font-size="13.8" fill="#CAD4E0">• Kháng cự lại FOMO và FUD từ mạng xã hội.</text>
    <text x="26" y="322" font-size="13.8" fill="#26E7A6" font-weight="600">• Mua khi Mr. Market hoảng loạn, bán tháo</text>
    <text x="38" y="344" font-size="13.8" fill="#26E7A6" font-weight="600">tài sản tốt với giá bèo bọt.</text>
    <text x="26" y="374" font-size="13.8" fill="#FF5252" font-weight="600">• Chốt lời hoặc đứng ngoài khi đám đông</text>
    <text x="38" y="396" font-size="13.8" fill="#FF5252" font-weight="600">bị Mr. Market cuốn vào cơn say mua đuổi.</text>

    <text x="207" y="445" font-size="12.8" fill="#F0B90B" font-style="italic" text-anchor="middle">«Giá cả là thứ bạn trả, Giá trị là thứ bạn nhận»</text>
  </g>

  <!-- ==================== ROW 2: 2 CARDS ==================== -->

  <!-- CARD 3: BIÊN AN TOÀN -->
  <g transform="translate(30, 635)" filter="url(#shadow)">
    <rect width="415" height="500" rx="14" fill="url(#card-grad-cyan)" stroke="#00E5FF" stroke-width="2"/>
    <rect width="415" height="50" rx="14" fill="#00E5FF"/>
    <path d="M 0 35 L 0 50 L 415 50 L 415 35 Z" fill="#00E5FF"/>
    <circle cx="26" cy="25" r="14" fill="#0B0E14"/>
    <text x="26" y="31" font-size="14.5" font-weight="900" fill="#00E5FF" text-anchor="middle">3</text>
    <text x="48" y="32" font-size="15" font-weight="800" fill="#0B0E14">BIÊN AN TOÀN (MARGIN OF SAFETY)</text>

    <!-- Content -->
    <text x="18" y="80" font-size="14.5" font-weight="700" fill="#00E5FF">Trụ cột linh hồn của Đầu tư Giá trị:</text>
    
    <text x="18" y="108" font-size="13.8" fill="#CAD4E0">• Là khoảng cách chiết khấu sâu giữa</text>
    <text x="30" y="130" font-size="13.8" fill="#CAD4E0"><tspan fill="#FFF" font-weight="700">Giá trị thực (Value)</tspan> và <tspan fill="#00E5FF" font-weight="700">Thị giá (Price)</tspan>.</text>
    
    <text x="18" y="160" font-size="13.8" fill="#CAD4E0">• Mục đích: Hấp thụ sai số định giá,</text>
    <text x="30" y="182" font-size="13.8" fill="#CAD4E0">thiên nga đen và suy thoái kinh tế vĩ mô.</text>

    <!-- Inner Highlight Box -->
    <rect x="16" y="206" width="383" height="270" rx="10" fill="#061619" stroke="#123840" stroke-width="1.4"/>
    <rect x="16" y="206" width="383" height="34" rx="10" fill="#0D262B"/>
    <path d="M 16 226 L 16 240 L 399 240 L 399 226 Z" fill="#0D262B"/>
    <text x="28" y="229" font-size="13.5" font-weight="800" fill="#00E5FF">⚡ KẾT NỐI VSA &amp; PRICE ACTION:</text>

    <text x="26" y="266" font-size="13.8" fill="#CAD4E0">• Biên an toàn chính là <tspan fill="#26E7A6" font-weight="700">Vùng Chiết Khấu Sâu</tspan>.</text>
    <text x="26" y="294" font-size="13.8" fill="#CAD4E0">• Xuất hiện cú rũ bỏ <tspan fill="#00E5FF" font-weight="700">Spring Wyckoff</tspan></text>
    <text x="38" y="316" font-size="13.8" fill="#CAD4E0">kèm thanh nến cạn Volume (No Supply Test).</text>
    <text x="26" y="346" font-size="13.8" fill="#26E7A6" font-weight="600">• Tỷ lệ Lợi nhuận / Rủi ro đạt: R:R ≥ 1:4</text>
    <text x="38" y="368" font-size="13.8" fill="#CAD4E0">nhờ đặt mức dừng lỗ (Stop Loss) cực ngắn.</text>
    <text x="26" y="398" font-size="13.8" fill="#CAD4E0">• Bảo vệ tài khoản không bao giờ bị xóa sổ.</text>

    <text x="207" y="445" font-size="12.8" fill="#CAD4E0" font-style="italic" text-anchor="middle">«Biến thời gian thành đồng minh vĩ đại của bạn»</text>
  </g>

  <!-- CARD 4: PHÂN LOẠI NHÀ ĐẦU TƯ -->
  <g transform="translate(475, 635)" filter="url(#shadow)">
    <rect width="415" height="500" rx="14" fill="url(#card-grad-green)" stroke="#089981" stroke-width="2"/>
    <rect width="415" height="50" rx="14" fill="#089981"/>
    <path d="M 0 35 L 0 50 L 415 50 L 415 35 Z" fill="#089981"/>
    <circle cx="26" cy="25" r="14" fill="#0B0E14"/>
    <text x="26" y="31" font-size="14.5" font-weight="900" fill="#26E7A6" text-anchor="middle">4</text>
    <text x="48" y="32" font-size="15" font-weight="800" fill="#FFFFFF">PHÒNG THỦ VS. CHỦ ĐỘNG</text>

    <!-- Content -->
    <text x="18" y="80" font-size="14.5" font-weight="700" fill="#26E7A6">Tự lượng sức mình — Yếu tố cốt lõi:</text>
    
    <text x="18" y="108" font-size="13.8" fill="#CAD4E0">• <tspan fill="#FFF" font-weight="700">Phòng thủ (Defensive):</tspan> Ưu tiên an toàn,</text>
    <text x="30" y="130" font-size="13.8" fill="#CAD4E0">50% Trái phiếu + 50% Cổ phiếu lớn, mua DCA.</text>
    
    <text x="18" y="160" font-size="13.8" fill="#CAD4E0">• <tspan fill="#26E7A6" font-weight="700">Chủ động (Enterprising):</tspan> Đọc BCTC,</text>
    <text x="30" y="182" font-size="13.8" fill="#CAD4E0">săn cổ phiếu Net-Net dưới vốn lưu động ròng.</text>

    <!-- Inner Highlight Box -->
    <rect x="16" y="206" width="383" height="270" rx="10" fill="#081713" stroke="#173B30" stroke-width="1.4"/>
    <rect x="16" y="206" width="383" height="34" rx="10" fill="#0F2821"/>
    <path d="M 16 226 L 16 240 L 399 240 L 399 226 Z" fill="#0F2821"/>
    <text x="28" y="229" font-size="13.5" font-weight="800" fill="#26E7A6">⚡ CẢNH BÁO NGUY CƠ "NỬA VỜI":</text>

    <text x="26" y="266" font-size="13.8" fill="#CAD4E0">• Sai lầm lớn nhất: Người bận rộn nhưng</text>
    <text x="38" y="288" font-size="13.8" fill="#FF5252" font-weight="600">lại ảo tưởng mình là trader lướt sóng T+.</text>
    <text x="26" y="318" font-size="13.8" fill="#CAD4E0">• Nếu bạn ít thời gian: Hãy tự hào làm một</text>
    <text x="38" y="340" font-size="13.8" fill="#26E7A6" font-weight="600">nhà đầu tư phòng thủ kỷ luật và an nhàn.</text>
    <text x="26" y="370" font-size="13.8" fill="#CAD4E0">• Lợi nhuận tỷ lệ thuận với công sức</text>
    <text x="38" y="392" font-size="13.8" fill="#F0B90B" font-weight="600">thông minh, không phải độ liều lĩnh!</text>

    <text x="207" y="445" font-size="12.8" fill="#CAD4E0" font-style="italic" text-anchor="middle">«Biết rõ mình là ai quan trọng hơn đoán đỉnh đáy»</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(460, 1165)" text-anchor="middle">
    <text font-size="13.5" fill="#8E9BAE">
      Đóng dấu bản quyền: <tspan fill="#00E5FF" font-weight="700">PTvolume.com</tspan> • Phân Tích Kỹ Thuật • Naked Chart • VSA • Wyckoff
    </text>
  </g>
</svg>
