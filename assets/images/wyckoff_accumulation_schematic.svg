<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-wyckoff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <filter id="shadow-wyckoff" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="680" fill="url(#bg-wyckoff)" rx="16"/>
  <rect width="1094" height="674" x="3" y="3" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- HEADER -->
  <g transform="translate(550, 48)" text-anchor="middle">
    <rect x="-460" y="-26" width="920" height="52" rx="26" fill="#141926" stroke="rgba(240, 185, 11, 0.4)" stroke-width="1.8"/>
    <text y="7" font-size="19" font-weight="800" fill="#F0B90B" letter-spacing="0.8">
      SƠ ĐỒ 5 PHA TÍCH LŨY WYCKOFF CHUẨN (ACCUMULATION SCHEMATIC)
    </text>
    <text y="42" font-size="13" fill="#8E9BAE">
      Phương Pháp Richard Wyckoff &amp; Dấu Chân Smart Money • PTvolume.com
    </text>
  </g>

  <!-- DIAGRAM CANVAS -->
  <g transform="translate(50, 115)" filter="url(#shadow-wyckoff)">
    <rect width="1000" height="490" rx="14" fill="#0E141D" stroke="#222938" stroke-width="1.5"/>

    <!-- Phase Delimiters -->
    <line x1="240" y1="20" x2="240" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="490" y1="20" x2="490" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="680" y1="20" x2="680" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="840" y1="20" x2="840" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Phase Labels -->
    <text x="140" y="45" font-size="13" font-weight="800" fill="#6095FF" text-anchor="middle">PHA A: DỪNG XU HƯỚNG</text>
    <text x="365" y="45" font-size="13" font-weight="800" fill="#00E5FF" text-anchor="middle">PHA B: XÂY DỰNG NGUYÊN NHÂN</text>
    <text x="585" y="45" font-size="13" font-weight="800" fill="#F0B90B" text-anchor="middle">PHA C: THỬ NGHIỆM (SPRING)</text>
    <text x="760" y="45" font-size="13" font-weight="800" fill="#26E7A6" text-anchor="middle">PHA D: XÁC NHẬN SỨC MẠNH</text>
    <text x="920" y="45" font-size="13" font-weight="800" fill="#089981" text-anchor="middle">PHA E: TĂNG TỐC</text>

    <!-- TR BOUNDARIES -->
    <!-- Resistance Line (Creek) -->
    <line x1="50" y1="170" x2="950" y2="170" stroke="#F23645" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="60" y="162" font-size="11" font-weight="700" fill="#FF707E">NGƯỠNG KHÁNG CỰ (CREEK / RESISTANCE)</text>

    <!-- Support Line (Ice) -->
    <line x1="50" y1="310" x2="950" y2="310" stroke="#089981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="60" y="328" font-size="11" font-weight="700" fill="#26E7A6">NGƯỠNG HỖ TRỢ (ICE / SUPPORT)</text>

    <!-- Price Wave Path -->
    <!-- Downtrend into SC -->
    <path d="M 40 80 L 100 240 L 125 210 L 160 325 L 210 175 L 245 305 L 300 185 L 360 295 L 430 195 L 480 300 L 530 250 L 580 360 L 630 240 L 670 290 L 730 150 L 780 200 L 850 110 L 960 50" fill="none" stroke="#CAD4E0" stroke-width="3.5"/>

    <!-- Key Event Labels -->
    <!-- PS -->
    <circle cx="100" cy="240" r="5" fill="#6095FF"/>
    <text x="90" y="260" font-size="11" font-weight="700" fill="#6095FF">PS</text>

    <!-- SC (Selling Climax) -->
    <circle cx="160" cy="325" r="7" fill="#F23645"/>
    <text x="160" y="352" font-size="12" font-weight="800" fill="#FF707E" text-anchor="middle">SC (Cao trào bán)</text>

    <!-- AR (Automatic Rally) -->
    <circle cx="210" cy="175" r="6" fill="#089981"/>
    <text x="210" y="155" font-size="11.5" font-weight="800" fill="#089981" text-anchor="middle">AR (Hồi tự động)</text>

    <!-- ST (Secondary Test) -->
    <circle cx="245" cy="305" r="6" fill="#00E5FF"/>
    <text x="245" y="290" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">ST</text>

    <!-- Phase B Tests -->
    <text x="360" y="265" font-size="10.5" fill="#8E9BAE" text-anchor="middle">Hấp thụ cung ngầm</text>

    <!-- SPRING (PHASE C) - HIGHLIGHTED -->
    <circle cx="580" cy="360" r="9" fill="#F0B90B" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="520" y="380" width="120" height="26" rx="4" fill="#241C0A" stroke="#F0B90B"/>
    <text x="580" y="398" font-size="12" font-weight="900" fill="#F0B90B" text-anchor="middle">★ SPRING (RŨ BỎ)</text>

    <!-- TEST of Spring -->
    <circle cx="670" cy="290" r="6" fill="#26E7A6"/>
    <text x="670" y="275" font-size="11" font-weight="800" fill="#26E7A6" text-anchor="middle">Test of Spring</text>

    <!-- SOS (Sign of Strength) -->
    <circle cx="730" cy="150" r="7" fill="#089981"/>
    <text x="730" y="132" font-size="12" font-weight="800" fill="#26E7A6" text-anchor="middle">JAC / SOS (Bứt Phá)</text>

    <!-- LPS (Last Point of Support) -->
    <circle cx="780" cy="200" r="8" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="780" y="225" font-size="11.5" font-weight="800" fill="#00E5FF" text-anchor="middle">LPS (Điểm Mua Gia Tăng)</text>

    <!-- Markup Phase E -->
    <text x="900" y="100" font-size="12.5" font-weight="900" fill="#089981">MARKUP TREND &gt;&gt;</text>
  </g>

  <!-- FOOTER WATERMARK -->
  <g transform="translate(550, 645)" text-anchor="middle">
    <text font-size="12.5" fill="#CAD4E0" font-weight="600">
      Đóng dấu bản quyền: <tspan fill="#00E5FF" font-weight="800">PTvolume.com</tspan> • Chuyên Trang Naked Chart, VSA &amp; Phương Pháp Wyckoff
    </text>
  </g>
</svg>