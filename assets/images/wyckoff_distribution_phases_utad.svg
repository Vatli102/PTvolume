      <text x="18" y="26" fill="#FF707E" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Bẫy Thanh Khoản Hoàn Hảo Của Cá Mập:</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Giá vọt qua đỉnh cũ để quét sạch toàn bộ lệnh Stop Loss của phe Bán.</text>
      <text x="18" y="74" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Kích thích hàng triệu lệnh Buy đuổi theo của nhóm Breakout Trader.</text>
      <text x="18" y="98" fill="#FF707E" font-family="'Inter', sans-serif" font-size="12.5">• Toàn bộ thanh khoản dồi dào đó trở thành nơi xả hàng cuối cùng của Smart Money!</text>
    </g>

    <g transform="translate(24, 215)">
      <rect width="482" height="130" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="26" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Cách Nhận Biết Phiên UTAD Thật Sự:</text>
      <text x="18" y="50" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Nến có râu trên dài ngoằng, giá đóng cửa tụt lùi về nửa dưới thanh nến.</text>
      <text x="18" y="74" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Volume cực cao nhưng giá không giữ được đà tăng sang phiên sau.</text>
      <text x="18" y="98" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">• Ngay sau đó là một thanh nến đỏ thân dài dội thẳng vào trong vùng TR.</text>
      <text x="18" y="118" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="12.5">• Cơ hội bán khống tuyệt vời hoặc lập tức thoát hết danh mục mua!</text>
    </g>

    <g transform="translate(24, 365)">
      <rect width="482" height="95" rx="8" fill="rgba(242, 54, 69, 0.06)" stroke="rgba(242, 54, 69, 0.3)" />
      <text x="18" y="28" fill="#FF707E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">⚠️ Lời Nhắc Sinh Tử:</text>
      <text x="18" y="52" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">"Đừng bao giờ trung bình giá xuống khi thị trường đang rơi qua đường băng</text>
      <text x="18" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13">ICE. Cắt lỗ nhanh gọn là đức tính số 1 bảo vệ bạn sống sót dài lâu!"</text>
    </g>
