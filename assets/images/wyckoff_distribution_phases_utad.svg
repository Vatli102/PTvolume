  <!-- Right: UTAD Anatomy -->
  <g transform="translate(670, 150)">
    <rect width="530" height="490" rx="12" fill="url(#card8)" stroke="rgba(240, 185, 11, 0.3)" stroke-width="1.5" />
    <rect width="530" height="50" rx="12" fill="rgba(240, 185, 11, 0.08)" />
    <text x="24" y="32" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="16" font-weight="700">2. Giải Phẫu Cú Lừa UTAD (Upthrust After Distribution)</text>

    <g transform="translate(24, 75)">
