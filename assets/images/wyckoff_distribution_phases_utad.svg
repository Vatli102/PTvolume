<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" /><stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="card8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" /><stop offset="100%" stop-color="#10141D" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg8)" />
  <rect x="80" y="35" width="240" height="28" rx="14" fill="rgba(242, 54, 69, 0.12)" stroke="rgba(242, 54, 69, 0.35)" />
  <text x="200" y="54" fill="#F23645" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">PHƯƠNG PHÁP WYCKOFF • BÀI 8</text>
  <text x="80" y="95" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Bóc Tách 5 Pha Phân Phối Đỉnh &amp; Bẫy Mua Đỉnh UTAD (Pha C)</text>
  <text x="80" y="120" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Giải mã cách Smart Money dụ dỗ đám đông mua đỉnh trước khi đạp giá sụp đổ</text>

  <!-- Left: 5 Distribution Phases -->
  <g transform="translate(80, 150)">
    <rect width="530" height="490" rx="12" fill="url(#card8)" stroke="rgba(242, 54, 69, 0.3)" stroke-width="1.5" />
    <rect width="530" height="50" rx="12" fill="rgba(242, 54, 69, 0.08)" />
    <text x="24" y="32" fill="#F23645" font-family="'Inter', sans-serif" font-size="16" font-weight="700">1. Tiến Trình 5 Pha Phân Phối (Phase A &ndash; E)</text>

    <g transform="translate(24, 65)">
      <rect width="482" height="70" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="24" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Pha A &ndash; Chặn Đứng Xu Hướng Tăng:</text>
      <text x="18" y="46" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12.5">Xuất hiện PSY, quá mua cực đại BC (Buying Climax) và cú rơi tự động AR.</text>
    </g>

    <g transform="translate(24, 145)">
      <rect width="482" height="70" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="24" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Pha B &ndash; Xây Dựng Nguyên Nhân Phân Phối:</text>
      <text x="18" y="46" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12.5">Smart Money âm thầm xả hàng sang tay nhỏ lẻ hưng phấn; biên độ lỏng lẻo.</text>
    </g>

    <g transform="translate(24, 225)">
      <rect width="482" height="70" rx="8" fill="#141822" stroke="rgba(242, 54, 69, 0.35)" />
      <text x="18" y="24" fill="#FF707E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Pha C &ndash; Bẫy Mua Đỉnh Upthrust (UT / UTAD):</text>
      <text x="18" y="46" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12.5">Cú nhử vượt đỉnh giả để kích hoạt FOMO mua đuổi trước khi rơi ngược.</text>
    </g>

    <g transform="translate(24, 305)">
      <rect width="482" height="70" rx="8" fill="#141822" stroke="#222938" />
      <text x="18" y="24" fill="#FF707E" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">Pha D &ndash; Nguồn Cung Áp Đảo Hoàn Toàn:</text>
      <text x="18" y="46" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12.5">Xuất hiện các thanh nến suy yếu SOW và các điểm kháng cự cuối cùng LPSY.</text>
    </g>

    <g transform="translate(24, 385)">
