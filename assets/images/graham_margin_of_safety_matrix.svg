<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 710" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <linearGradient id="safe-zone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(8, 153, 129, 0.22)" />
      <stop offset="100%" stop-color="rgba(8, 153, 129, 0.03)" />
    </linearGradient>
    <linearGradient id="danger-zone" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(242, 54, 69, 0.22)" />
      <stop offset="100%" stop-color="rgba(242, 54, 69, 0.03)" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="710" fill="url(#bg-canvas)" rx="16"/>
  <rect width="912" height="702" x="4" y="4" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- Header -->
  <g transform="translate(460, 42)" text-anchor="middle">
    <rect x="-420" y="-24" width="840" height="48" rx="24" fill="#141926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.6"/>
    <text y="7" font-size="18.5" font-weight="800" fill="#00E5FF" letter-spacing="0.6">
      MÔ HÌNH BIÊN AN TOÀN (MARGIN OF SAFETY)
    </text>
    <text y="40" font-size="13.5" fill="#8E9BAE">
      Lớp đệm chiết khấu bảo vệ vốn trước thiên nga đen &amp; điểm kiểm định cạn cung VSA
    </text>
  </g>

  <!-- ZONE SHADING -->
  <!-- Overvalued Danger Zone (Above y=280) -->
  <rect x="40" y="110" width="840" height="170" fill="url(#danger-zone)"/>
  <!-- Undervalued Safe Zone (Below y=280) -->
  <rect x="40" y="280" width="840" height="230" fill="url(#safe-zone)"/>

  <!-- Horizontal Grid Lines -->
  <line x1="40" y1="130" x2="880" y2="130" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="40" y1="205" x2="880" y2="205" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="40" y1="365" x2="880" y2="365" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="40" y1="445" x2="880" y2="445" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="40" y1="525" x2="880" y2="525" stroke="#253046" stroke-width="1.5"/>

  <!-- INTRINSIC VALUE LINE (Straight Golden Line at y=280) -->
  <line x1="40" y1="280" x2="880" y2="280" stroke="#F0B90B" stroke-width="3.2" stroke-dasharray="8 5"/>
  <rect x="50" y="264" width="245" height="32" rx="6" fill="#1C160B" stroke="#F0B90B" stroke-width="1.4"/>
  <text x="172" y="285" font-size="12.8" font-weight="800" fill="#F0B90B" text-anchor="middle">
    ĐƯỜNG GIÁ TRỊ THỰC (INTRINSIC VALUE)
  </text>

  <!-- MARKET PRICE FLUCTUATION LINE -->
  <!-- Rallies smoothly to peak at x=520, y=140 -> plunges to trough at x=780, y=465 -> consolidates -->
  <path d="M 40 300 
           C 140 300, 220 260, 310 230 
           C 390 200, 460 140, 530 140 
           C 600 140, 640 210, 690 310 
           C 730 400, 750 465, 800 465 
           C 840 465, 860 390, 880 320" 
        fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

  <!-- Peak point -->
  <circle cx="530" cy="140" r="7" fill="#F23645"/>

  <!-- Trough point -->
  <circle cx="800" cy="465" r="8" fill="#089981"/>

  <!-- MARGIN OF SAFETY BRACKET (Between y=280 and y=465 at x=800) -->
  <line x1="800" y1="285" x2="800" y2="457" stroke="#00E5FF" stroke-width="3"/>
  <line x1="790" y1="285" x2="810" y2="285" stroke="#00E5FF" stroke-width="3"/>
  <line x1="790" y1="457" x2="810" y2="457" stroke="#00E5FF" stroke-width="3"/>

  <!-- Margin of Safety Tag -->
  <rect x="715" y="355" width="165" height="38" rx="6" fill="#0C1D24" stroke="#00E5FF" stroke-width="1.6"/>
  <text x="797" y="379" font-size="13.2" font-weight="800" fill="#00E5FF" text-anchor="middle">
    BIÊN AN TOÀN 40%
  </text>

  <!-- CALLOUT 1: OVERVALUED BUBBLE (Top-Left: x=50, y=115) -->
  <g transform="translate(50, 115)" filter="url(#shadow)">
    <rect width="335" height="130" rx="10" fill="#1C0D11" stroke="#F23645" stroke-width="1.6"/>
    
    <!-- Badge -->
    <rect x="12" y="12" width="220" height="26" rx="5" fill="#F23645"/>
    <text x="122" y="29" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">
      ❌ BONG BÓNG ĐỊNH GIÁ
    </text>

    <!-- Content -->
    <text x="14" y="62" font-size="13" fill="#CAD4E0">• Thị giá vượt xa giá trị thực (P/E &gt; 35+).</text>
    <text x="14" y="84" font-size="13" fill="#CAD4E0">• Đám đông hưng phấn FOMO mua đuổi đỉnh.</text>
    
    <text x="14" y="112" font-size="12.5" font-weight="800" fill="#FF5252">
      ➔ BIÊN AN TOÀN = ÂM (Rủi ro cực đại)
    </text>

    <!-- Pointer arrow to peak -->
    <line x1="335" y1="40" x2="505" y2="135" stroke="#F23645" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>

  <!-- CALLOUT 2: DISCOUNT ZONE (Lower-Left/Center: x=240, y=340) -->
  <g transform="translate(240, 335)" filter="url(#shadow)">
    <rect width="420" height="180" rx="10" fill="#0A1815" stroke="#089981" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="14" y="14" width="270" height="28" rx="5" fill="#089981"/>
    <text x="149" y="33" font-size="13.5" font-weight="800" fill="#FFF" text-anchor="middle">
      ✓ VÙNG BIÊN AN TOÀN CAO (DISCOUNT)
    </text>

    <!-- Content -->
    <text x="16" y="68" font-size="13.5" fill="#CAD4E0">• Thị giá chiết khấu <tspan fill="#F0B90B" font-weight="700">30% - 50%</tspan> dưới giá trị thực.</text>
    <text x="16" y="92" font-size="13.5" fill="#CAD4E0">• <tspan fill="#00E5FF" font-weight="700">Tín hiệu VSA:</tspan> Bán tháo Selling Climax cạn cung.</text>
    <text x="16" y="116" font-size="13.5" fill="#CAD4E0">• Tỷ lệ Lợi nhuận / Rủi ro đạt <tspan fill="#26E7A6" font-weight="800">Risk:Reward ≥ 1:4</tspan>.</text>
    
    <rect x="12" y="134" width="396" height="32" rx="6" fill="#0B261F" stroke="#089981" stroke-width="1"/>
    <text x="210" y="155" font-size="12.5" font-weight="800" fill="#26E7A6" text-anchor="middle">
      ➔ HÀNH ĐỘNG: GIẢI NGÂN MUA GOM TÍCH SẢN TỪNG PHẦN
    </text>

    <!-- Pointer arrow to trough -->
    <line x1="420" y1="120" x2="770" y2="455" stroke="#089981" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>

  <!-- Bottom Annotation Banner -->
  <g transform="translate(30, 635)">
    <rect width="860" height="54" rx="8" fill="#141926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.4"/>
    <text x="430" y="24" font-size="13" fill="#CAD4E0" text-anchor="middle">
      <tspan fill="#00E5FF" font-weight="800">Nguyên lý cốt lõi của Benjamin Graham:</tspan> "Biên an toàn không bảo đảm bạn sẽ kiếm lời ngay lập tức,"
    </text>
    <text x="430" y="44" font-size="13" fill="#CAD4E0" text-anchor="middle">
      "nhưng nó bảo đảm bạn <tspan fill="#F0B90B" font-weight="800">không bao giờ bị xóa sổ</tspan> khỏi thị trường khi có biến cố thiên nga đen xảy ra."
    </text>
  </g>
</svg>
