<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <linearGradient id="safe-zone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(8, 153, 129, 0.22)" />
      <stop offset="100%" stop-color="rgba(8, 153, 129, 0.03)" />
    </linearGradient>
    <linearGradient id="danger-zone" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(242, 54, 69, 0.22)" />
      <stop offset="100%" stop-color="rgba(242, 54, 69, 0.03)" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1160" height="680" fill="url(#bg-canvas)" rx="16"/>
  <rect width="1152" height="672" x="4" y="4" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- Header -->
  <g transform="translate(580, 42)" text-anchor="middle">
    <rect x="-460" y="-24" width="920" height="48" rx="24" fill="#141926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.6"/>
    <text y="7" font-size="18" font-weight="800" fill="#00E5FF" letter-spacing="0.6">
      MÔ HÌNH BIÊN AN TOÀN (MARGIN OF SAFETY) &amp; ĐIỂM GIẢI NGÂN DÒNG TIỀN LỚN
    </text>
    <text y="40" font-size="13" fill="#8E9BAE">
      Lớp đệm chiết khấu bảo vệ vốn trước sai số định giá &amp; kết nối với điểm kiểm định cạn cung VSA
    </text>
  </g>

  <!-- ZONE SHADING -->
  <!-- Overvalued Danger Zone (Above Intrinsic Value line y=270) -->
  <rect x="60" y="110" width="1040" height="160" fill="url(#danger-zone)"/>
  <!-- Undervalued Safe Zone (Below Intrinsic Value line y=270) -->
  <rect x="60" y="270" width="1040" height="190" fill="url(#safe-zone)"/>

  <!-- Horizontal Grid Lines -->
  <line x1="60" y1="130" x2="1100" y2="130" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="200" x2="1100" y2="200" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="360" x2="1100" y2="360" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="430" x2="1100" y2="430" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="500" x2="1100" y2="500" stroke="#253046" stroke-width="1.5"/>

  <!-- INTRINSIC VALUE LINE (Straight Golden Line at y=270) -->
  <line x1="60" y1="270" x2="1100" y2="270" stroke="#F0B90B" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="70" y="256" width="240" height="28" rx="6" fill="#1C160B" stroke="#F0B90B" stroke-width="1.2"/>
  <text x="190" y="275" font-size="11.5" font-weight="800" fill="#F0B90B" text-anchor="middle">
    ĐƯỜNG GIÁ TRỊ THỰC (INTRINSIC VALUE)
  </text>

  <!-- MARKET PRICE FLUCTUATION LINE (Smooth Path completely avoiding callout boxes) -->
  <!-- Starts at 270 -> rallies up to peak at x=620, y=140 -> plunges to trough at x=940, y=430 -> curves back -->
  <path d="M 60 290 
           C 180 290, 260 250, 360 220 
           C 460 190, 540 135, 620 135 
           C 700 135, 750 200, 800 290 
           C 850 380, 890 440, 950 440 
           C 1010 440, 1050 360, 1100 300" 
        fill="none" stroke="#E2E8F0" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Peak point indicator -->
  <circle cx="620" cy="135" r="7" fill="#F23645"/>

  <!-- Trough point indicator -->
  <circle cx="950" cy="440" r="8" fill="#089981"/>

  <!-- MARGIN OF SAFETY BRACKET AT TROUGH (x=950, between y=270 and y=440) -->
  <line x1="950" y1="275" x2="950" y2="432" stroke="#00E5FF" stroke-width="3"/>
  <line x1="940" y1="275" x2="960" y2="275" stroke="#00E5FF" stroke-width="3"/>
  <line x1="940" y1="432" x2="960" y2="432" stroke="#00E5FF" stroke-width="3"/>

  <!-- Margin of Safety Value Tag -->
  <rect x="965" y="335" width="130" height="34" rx="6" fill="#0C1D24" stroke="#00E5FF" stroke-width="1.4"/>
  <text x="1030" y="356" font-size="11.5" font-weight="800" fill="#00E5FF" text-anchor="middle">
    BIÊN AN TOÀN 35%
  </text>

  <!-- CALLOUT 1: OVERVALUED BUBBLE (Placed in upper-left open area: x=70, y=120) -->
  <g transform="translate(70, 115)" filter="url(#shadow)">
    <rect width="360" height="120" rx="10" fill="#1C0D11" stroke="#F23645" stroke-width="1.6"/>
    
    <!-- Header Badge -->
    <rect x="12" y="12" width="220" height="24" rx="5" fill="#F23645"/>
    <text x="122" y="28" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">
      ❌ BONG BÓNG ĐỊNH GIÁ (PREMIUM)
    </text>

    <!-- Content -->
    <text x="16" y="58" font-size="11.5" fill="#CAD4E0">• Thị giá vượt xa giá trị thực (P/E &gt; 35 - 50+).</text>
    <text x="16" y="78" font-size="11.5" fill="#CAD4E0">• Đám đông hưng phấn FOMO, thanh khoản bùng nổ.</text>
    
    <text x="16" y="104" font-size="11.5" font-weight="800" fill="#FF5252">
      ➔ BIÊN AN TOÀN = ÂM (Rủi ro đu đỉnh nặng nề)
    </text>

    <!-- Pointer arrow to peak -->
    <line x1="360" y1="40" x2="590" y2="125" stroke="#F23645" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>

  <!-- CALLOUT 2: DISCOUNT ZONE / MARGIN OF SAFETY (Placed in lower-left/center open area: x=340, y=320) -->
  <g transform="translate(340, 315)" filter="url(#shadow)">
    <rect width="420" height="165" rx="10" fill="#0A1815" stroke="#089981" stroke-width="1.8"/>
    
    <!-- Header Badge -->
    <rect x="14" y="14" width="260" height="26" rx="5" fill="#089981"/>
    <text x="144" y="31" font-size="11.8" font-weight="800" fill="#FFF" text-anchor="middle">
      ✓ VÙNG BIÊN AN TOÀN CAO (DISCOUNT)
    </text>

    <!-- Content -->
    <text x="16" y="64" font-size="11.8" fill="#CAD4E0">• Thị giá chiết khấu <tspan fill="#F0B90B" font-weight="700">30% - 50%</tspan> dưới giá trị nội tại.</text>
    <text x="16" y="86" font-size="11.8" fill="#CAD4E0">• <tspan fill="#00E5FF" font-weight="700">Tín hiệu VSA:</tspan> Bán tháo Selling Climax cạn kiệt nguồn cung.</text>
    <text x="16" y="108" font-size="11.8" fill="#CAD4E0">• Tỷ lệ Lợi nhuận / Rủi ro đạt <tspan fill="#26E7A6" font-weight="800">Risk:Reward ≥ 1:4</tspan>.</text>
    
    <rect x="12" y="124" width="396" height="28" rx="6" fill="#0B261F" stroke="#089981" stroke-width="1"/>
    <text x="210" y="142" font-size="11.2" font-weight="800" fill="#26E7A6" text-anchor="middle">
      ➔ HÀNH ĐỘNG: GIẢI NGÂN MUA GOM TÍCH SẢN TỪNG PHẦN
    </text>

    <!-- Pointer arrow to trough -->
    <line x1="420" y1="110" x2="920" y2="430" stroke="#089981" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>

  <!-- Bottom Annotation Banner -->
  <g transform="translate(60, 605)">
    <rect width="1040" height="52" rx="8" fill="#141926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.4"/>
    <text x="520" y="24" font-size="12" fill="#CAD4E0" text-anchor="middle">
      <tspan fill="#00E5FF" font-weight="800">Nguyên lý cốt lõi của Benjamin Graham:</tspan> "Biên an toàn không bảo đảm bạn sẽ kiếm được lợi nhuận ngay lập tức,"
    </text>
    <text x="520" y="42" font-size="12" fill="#CAD4E0" text-anchor="middle">
      "nhưng nó bảo đảm bạn <tspan fill="#F0B90B" font-weight="800">không bao giờ bị xóa sổ</tspan> khỏi thị trường tài chính khi có biến cố thiên nga đen xảy ra."
    </text>
  </g>
</svg>
