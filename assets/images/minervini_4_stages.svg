<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-stages" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0E14" />
            <stop offset="100%" stop-color="#141822" />
        </linearGradient>
        <linearGradient id="stage2-glow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#089981" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#089981" stop-opacity="0.0" />
        </linearGradient>
        <linearGradient id="stage4-glow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F23645" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#F23645" stop-opacity="0.0" />
        </linearGradient>
        <filter id="shadow-stages">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="920" height="540" fill="url(#bg-stages)" rx="12"/>
    <rect x="1" y="1" width="918" height="538" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

    <!-- Title -->
    <text x="460" y="38" font-family="'Inter', sans-serif" font-size="19" font-weight="800" fill="#00E5FF" text-anchor="middle">CHU KỲ 4 GIAI ĐOẠN CỦA CỔ PHIẾU (THE 4 STAGES OF A STOCK)</text>
    <text x="460" y="60" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#8E9BAE" text-anchor="middle">Nguyên Tắc Sống Còn Của Mark Minervini: "Chỉ Giao Dịch Ở Giai Đoạn 2 Tăng Tốc"</text>

    <!-- 4 Stage Column Backgrounds & Boundaries -->
    <!-- Stage 1 Background -->
    <rect x="40" y="80" width="200" height="400" fill="#131722" opacity="0.4"/>
    <line x1="240" y1="80" x2="240" y2="480" stroke="#222938" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Stage 2 Background -->
    <rect x="240" y="80" width="280" height="400" fill="url(#stage2-glow)"/>
    <line x1="520" y1="80" x2="520" y2="480" stroke="#222938" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Stage 3 Background -->
    <rect x="520" y="80" width="180" height="400" fill="#1A1B24" opacity="0.3"/>
    <line x1="700" y1="80" x2="700" y2="480" stroke="#222938" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Stage 4 Background -->
    <rect x="700" y="80" width="180" height="400" fill="url(#stage4-glow)"/>

    <!-- Stage Header Badges -->
    <!-- Stage 1 -->
    <rect x="55" y="92" width="170" height="34" rx="6" fill="#1A2130" stroke="#4B5563" stroke-width="1"/>
    <text x="140" y="108" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#CAD4E0" text-anchor="middle">GIAI ĐOẠN 1</text>
    <text x="140" y="121" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#8E9BAE" text-anchor="middle">Tích Lũy / Bỏ Qua (Neglect)</text>

    <!-- Stage 2 -->
    <rect x="260" y="92" width="240" height="34" rx="6" fill="#0E2E28" stroke="#089981" stroke-width="1.5" filter="url(#shadow-stages)"/>
    <text x="380" y="108" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#00E5FF" text-anchor="middle">★ GIAI ĐOẠN 2: TĂNG TỐC (MARKUP)</text>
    <text x="380" y="121" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#089981" text-anchor="middle">VÙNG SIÊU LỢI NHUẬN (BUY ZONE)</text>

    <!-- Stage 3 -->
    <rect x="535" y="92" width="150" height="34" rx="6" fill="#2E2416" stroke="#F0B90B" stroke-width="1"/>
    <text x="610" y="108" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#F0B90B" text-anchor="middle">GIAI ĐOẠN 3</text>
    <text x="610" y="121" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#D97706" text-anchor="middle">Phân Phối / Đỉnh (Topping)</text>

    <!-- Stage 4 -->
    <rect x="715" y="92" width="150" height="34" rx="6" fill="#2E1619" stroke="#F23645" stroke-width="1"/>
    <text x="790" y="108" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#F23645" text-anchor="middle">GIAI ĐOẠN 4</text>
    <text x="790" y="121" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#EF4444" text-anchor="middle">Suy Thoái (Markdown)</text>

    <!-- Moving Average 200 SMA (Orange dashed) -->
    <path d="M 50 360 C 120 365, 180 355, 250 340 C 330 300, 420 230, 500 190 C 580 185, 650 210, 720 280 C 780 360, 830 420, 870 440" 
          fill="none" stroke="#F0B90B" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="80" y="380" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F0B90B">MA200 (Đường 200 ngày)</text>

    <!-- Stock Price Curve (Thick cyan & gradient path) -->
    <!-- Stage 1 Price (Whipsaws around flat line) -->
    <path d="M 50 350 Q 80 370, 100 340 T 140 365 T 180 345 T 220 360 T 250 320" 
          fill="none" stroke="#8E9BAE" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Stage 2 Price (Strong uptrend, higher highs & lows) -->
    <path d="M 250 320 Q 280 270, 310 280 T 360 210 T 410 225 T 460 150 T 510 160" 
          fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>

    <!-- Stage 3 Price (Wild volatile swings near peak) -->
    <path d="M 510 160 Q 540 135, 560 165 T 600 130 T 630 175 T 660 155 T 695 210" 
          fill="none" stroke="#F0B90B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Stage 4 Price (Severe collapse, lower lows) -->
    <path d="M 695 210 Q 720 290, 750 280 T 780 370 T 820 360 T 865 460" 
          fill="none" stroke="#F23645" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Annotations on Stage 2 -->
    <!-- Buy Signals -->
    <circle cx="260" cy="310" r="6" fill="#089981" stroke="#FFF" stroke-width="2"/>
    <circle cx="370" cy="205" r="6" fill="#089981" stroke="#FFF" stroke-width="2"/>
    <circle cx="470" cy="145" r="6" fill="#089981" stroke="#FFF" stroke-width="2"/>

    <g transform="translate(285, 230)" filter="url(#shadow-stages)">
        <rect width="180" height="52" rx="6" fill="#0A1E1A" stroke="#089981" stroke-width="1.5"/>
        <text x="90" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00E5FF" text-anchor="middle">✔ NỀN GIÁ KIẾN TẠO VCP</text>
        <text x="90" y="38" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#CAD4E0" text-anchor="middle">Giá &gt; MA50 &gt; MA150 &gt; MA200</text>
    </g>

    <!-- Annotations on Stage 3 & 4 -->
    <!-- Sell Warning -->
    <circle cx="680" cy="180" r="6" fill="#F23645" stroke="#FFF" stroke-width="2"/>
    <g transform="translate(545, 250)" filter="url(#shadow-stages)">
        <rect width="135" height="42" rx="6" fill="#241414" stroke="#F23645" stroke-width="1"/>
        <text x="67" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#F23645" text-anchor="middle">⚠ Phân Phối Khối Lượng</text>
        <text x="67" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#CAD4E0" text-anchor="middle">Chốt lời &amp; Rút lui</text>
    </g>

    <g transform="translate(720, 390)" filter="url(#shadow-stages)">
        <rect width="145" height="44" rx="6" fill="#241414" stroke="#F23645" stroke-width="1.5"/>
        <text x="72" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#F23645" text-anchor="middle">⛔ TUYỆT ĐỐI KHÔNG BẮT ĐÁY</text>
        <text x="72" y="33" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#FCA5A5" text-anchor="middle">Bẫy giá rẻ phá hủy tài khoản</text>
    </g>

    <!-- Bottom Legend / Rules -->
    <rect x="40" y="490" width="840" height="36" rx="6" fill="#0C101A" stroke="#1F2839" stroke-width="1"/>
    <text x="460" y="512" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#CAD4E0" text-anchor="middle">
        Đúc kết Mark Minervini: <tspan fill="#00E5FF" font-weight="800">"Hầu hết các siêu cổ phiếu tăng từ 100% đến 1000% đều diễn ra trong Giai đoạn 2. Nhiệm vụ của bạn là nhận diện và chỉ mua ở Giai đoạn 2."</tspan>
    </text>
</svg>
