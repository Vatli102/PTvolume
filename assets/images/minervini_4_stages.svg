<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-stages" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0E14" />
            <stop offset="100%" stop-color="#141822" />
        </linearGradient>
        <linearGradient id="stage2-glow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#089981" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#089981" stop-opacity="0.0" />
        </linearGradient>
        <linearGradient id="stage4-glow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F23645" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#F23645" stop-opacity="0.0" />
        </linearGradient>
        <filter id="shadow-stages">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="960" height="530" fill="url(#bg-stages)" rx="12"/>
    <rect x="1" y="1" width="958" height="528" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

    <!-- Title -->
    <text x="480" y="38" font-family="'Inter', sans-serif" font-size="18.5" font-weight="800" fill="#00E5FF" text-anchor="middle">CHU KỲ 4 GIAI ĐOẠN CỦA CỔ PHIẾU (THE 4 STAGES OF A STOCK)</text>
    <text x="480" y="60" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#8E9BAE" text-anchor="middle">Nguyên Tắc Sống Còn Của Mark Minervini: "Chỉ Giao Dịch Ở Giai Đoạn 2 Tăng Tốc"</text>

    <!-- 4 Stage Column Backgrounds & Boundaries -->
    <!-- Stage 1 Background -->
    <rect x="40" y="80" width="210" height="390" fill="#131722" opacity="0.4"/>
    <line x1="250" y1="80" x2="250" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Stage 2 Background -->
    <rect x="250" y="80" width="290" height="390" fill="url(#stage2-glow)"/>
    <line x1="540" y1="80" x2="540" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Stage 3 Background -->
    <rect x="540" y="80" width="190" height="390" fill="#1A1B24" opacity="0.3"/>
    <line x1="730" y1="80" x2="730" y2="470" stroke="#222938" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Stage 4 Background -->
    <rect x="730" y="80" width="190" height="390" fill="url(#stage4-glow)"/>

    <!-- Stage Header Badges -->
    <!-- Stage 1 -->
    <rect x="55" y="90" width="180" height="34" rx="6" fill="#1A2130" stroke="#4B5563" stroke-width="1"/>
    <text x="145" y="105" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#CAD4E0" text-anchor="middle">GIAI ĐOẠN 1</text>
    <text x="145" y="118" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#8E9BAE" text-anchor="middle">Tích Lũy / Bỏ Qua (Neglect)</text>

    <!-- Stage 2 -->
    <rect x="270" y="90" width="250" height="34" rx="6" fill="#0E2E28" stroke="#089981" stroke-width="1.5" filter="url(#shadow-stages)"/>
    <text x="395" y="105" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#00E5FF" text-anchor="middle">★ GIAI ĐOẠN 2: TĂNG TỐC (MARKUP)</text>
    <text x="395" y="118" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#089981" text-anchor="middle">VÙNG SIÊU LỢI NHUẬN (BUY ZONE)</text>

    <!-- Stage 3 -->
    <rect x="555" y="90" width="160" height="34" rx="6" fill="#2E2416" stroke="#F0B90B" stroke-width="1"/>
    <text x="635" y="105" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#F0B90B" text-anchor="middle">GIAI ĐOẠN 3</text>
    <text x="635" y="118" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#D97706" text-anchor="middle">Phân Phối / Đỉnh (Topping)</text>

    <!-- Stage 4 -->
    <rect x="745" y="90" width="160" height="34" rx="6" fill="#2E1619" stroke="#F23645" stroke-width="1"/>
    <text x="825" y="105" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#F23645" text-anchor="middle">GIAI ĐOẠN 4</text>
    <text x="825" y="118" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#EF4444" text-anchor="middle">Suy Thoái (Markdown)</text>

    <!-- Moving Average 200 SMA (Orange dashed) -->
    <path d="M 50 360 C 120 365, 180 355, 260 340 C 340 300, 440 230, 520 190 C 600 185, 680 210, 750 280 C 805 350, 855 410, 895 440" 
          fill="none" stroke="#F0B90B" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="85" y="380" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F0B90B">MA200 (Đường 200 ngày)</text>

    <!-- Stock Price Curve -->
    <!-- Stage 1 Price -->
    <path d="M 50 350 Q 80 370, 100 340 T 140 365 T 180 345 T 220 360 T 260 320" 
          fill="none" stroke="#8E9BAE" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Stage 2 Price -->
    <path d="M 260 320 Q 290 270, 320 280 T 380 210 T 430 225 T 480 150 T 530 160" 
          fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>

    <!-- Stage 3 Price -->
    <path d="M 530 160 Q 560 135, 580 165 T 620 130 T 650 175 T 680 155 T 725 210" 
          fill="none" stroke="#F0B90B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Stage 4 Price -->
    <path d="M 725 210 Q 750 290, 775 280 T 810 370 T 845 360 T 890 450" 
          fill="none" stroke="#F23645" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Annotations on Stage 2 -->
    <circle cx="270" cy="310" r="6" fill="#089981" stroke="#FFF" stroke-width="2"/>
    <circle cx="390" cy="205" r="6" fill="#089981" stroke="#FFF" stroke-width="2"/>
    <circle cx="490" cy="145" r="6" fill="#089981" stroke="#FFF" stroke-width="2"/>

    <g transform="translate(300, 230)" filter="url(#shadow-stages)">
        <rect width="180" height="52" rx="6" fill="#0A1E1A" stroke="#089981" stroke-width="1.5"/>
        <text x="90" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00E5FF" text-anchor="middle">✔ NỀN GIÁ KIẾN TẠO VCP</text>
        <text x="90" y="38" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#CAD4E0" text-anchor="middle">Giá &gt; MA50 &gt; MA150 &gt; MA200</text>
    </g>

    <!-- Annotations on Stage 3 & 4 -->
    <circle cx="710" cy="180" r="6" fill="#F23645" stroke="#FFF" stroke-width="2"/>
    <g transform="translate(565, 250)" filter="url(#shadow-stages)">
        <rect width="140" height="42" rx="6" fill="#241414" stroke="#F23645" stroke-width="1"/>
        <text x="70" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#F23645" text-anchor="middle">⚠ Phân Phối Khối Lượng</text>
        <text x="70" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#CAD4E0" text-anchor="middle">Chốt lời &amp; Rút lui</text>
    </g>

    <g transform="translate(745, 385)" filter="url(#shadow-stages)">
        <rect width="160" height="44" rx="6" fill="#241414" stroke="#F23645" stroke-width="1.5"/>
        <text x="80" y="18" font-family="'Inter', sans-serif" font-size="9.8" font-weight="800" fill="#F23645" text-anchor="middle">⛔ TUYỆT ĐỐI KHÔNG BẮT ĐÁY</text>
        <text x="80" y="33" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#FCA5A5" text-anchor="middle">Bẫy giá rẻ nguy hiểm</text>
    </g>

    <!-- Bottom Summary Bar (Centered, concise, no overflow) -->
    <rect x="60" y="480" width="840" height="38" rx="6" fill="#0C101A" stroke="#1F2839" stroke-width="1"/>
    <text x="480" y="504" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#CAD4E0" text-anchor="middle">
      Đúc kết Mark Minervini: <tspan fill="#00E5FF" font-weight="800">"Hầu hết các siêu cổ phiếu tăng 100%–1000% đều diễn ra trong Giai đoạn 2 Tăng tốc."</tspan>
    </text>
</svg>
