<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <!-- Bullish Candle Gradient -->
    <linearGradient id="bullishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#089981"/>
      <stop offset="100%" stop-color="#26E7A6"/>
    </linearGradient>

    <!-- Bearish Candle Gradient -->
    <linearGradient id="bearishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F23645"/>
      <stop offset="100%" stop-color="#FF6B7A"/>
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#00E5FF" />
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#F0B90B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" fill="url(#bgGrad)" rx="12" stroke="#222938" stroke-width="2"/>

  <!-- Title & Branding -->
  <text x="425" y="38" text-anchor="middle" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" letter-spacing="1">CẤU TRÚC 4 MỨC GIÁ CỦA NẾN NHẬT (OHLC ANATOMY)</text>
  <text x="425" y="60" text-anchor="middle" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="13">Nền Tảng Đọc Hành Vi Giá Price Action &amp; VSA Chuyên Sâu • PTvolume.com</text>

  <!-- Divider line -->
  <line x1="425" y1="85" x2="425" y2="440" stroke="#222938" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- ==================== CỘT 1: NẾN TĂNG (BULLISH) ==================== -->
  <g transform="translate(40, 0)">
    <!-- Subtitle -->
    <rect x="80" y="85" width="180" height="28" rx="14" fill="rgba(8, 153, 129, 0.15)" stroke="#089981" stroke-width="1.2"/>
    <text x="170" y="104" text-anchor="middle" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">NẾN TĂNG (BULLISH)</text>

    <!-- Nến Tăng Trục & Thân -->
    <!-- Bóng trên (Upper Shadow) -->
    <line x1="170" y1="130" x2="170" y2="190" stroke="#26E7A6" stroke-width="3"/>
    <!-- Thân nến (Real Body) -->
    <rect x="135" y="190" width="70" height="150" fill="url(#bullishGrad)" rx="3" stroke="#26E7A6" stroke-width="1.5"/>
    <!-- Bóng dưới (Lower Shadow) -->
    <line x1="170" y1="340" x2="170" y2="410" stroke="#26E7A6" stroke-width="3"/>

    <!-- CHỈ DẪN NẾN TĂNG (BÊN TRÁI & PHẢI) -->
    <!-- High (Giá cao nhất) -->
    <line x1="170" y1="130" x2="80" y2="130" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="170" cy="130" r="4" fill="#00E5FF"/>
    <text x="70" y="127" text-anchor="end" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">HIGH (Giá Cao Nhất)</text>
    <text x="70" y="143" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Đỉnh cao nhất phiên</text>

    <!-- Bóng trên -->
    <line x1="215" y1="160" x2="260" y2="160" stroke="#F0B90B" stroke-width="1.2" marker-start="url(#arrowGold)"/>
    <text x="270" y="156" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Bóng Trên (Upper Shadow)</text>
    <text x="270" y="172" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Lực cản phe Bán</text>

    <!-- Close (Giá đóng cửa) -->
    <line x1="135" y1="190" x2="80" y2="190" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="135" cy="190" r="4" fill="#26E7A6"/>
    <text x="70" y="187" text-anchor="end" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">CLOSE (Giá Đóng Cửa)</text>
    <text x="70" y="203" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Mức giá chốt phiên (Cao)</text>

    <!-- Thân nến (Real Body) -->
    <line x1="215" y1="265" x2="260" y2="265" stroke="#F0B90B" stroke-width="1.2" marker-start="url(#arrowGold)"/>
    <text x="270" y="261" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">THÂN NẾN (Real Body)</text>
    <text x="270" y="277" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Biên độ = Close - Open</text>
    <text x="270" y="293" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">&rarr; Phe Mua Thắng Thế</text>

    <!-- Open (Giá mở cửa) -->
    <line x1="135" y1="340" x2="80" y2="340" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="135" cy="340" r="4" fill="#00E5FF"/>
    <text x="70" y="337" text-anchor="end" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">OPEN (Giá Mở Cửa)</text>
    <text x="70" y="353" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Mức giá khởi điểm (Thấp)</text>

    <!-- Bóng dưới -->
    <line x1="215" y1="375" x2="260" y2="375" stroke="#F0B90B" stroke-width="1.2" marker-start="url(#arrowGold)"/>
    <text x="270" y="371" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Bóng Dưới (Lower Shadow)</text>
    <text x="270" y="387" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Lực bắt đáy phe Mua</text>

    <!-- Low (Giá thấp nhất) -->
    <line x1="170" y1="410" x2="80" y2="410" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="170" cy="410" r="4" fill="#00E5FF"/>
    <text x="70" y="407" text-anchor="end" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">LOW (Giá Thấp Nhất)</text>
    <text x="70" y="423" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Đáy thấp nhất phiên</text>
  </g>

  <!-- ==================== CỘT 2: NẾN GIẢM (BEARISH) ==================== -->
  <g transform="translate(455, 0)">
    <!-- Subtitle -->
    <rect x="80" y="85" width="180" height="28" rx="14" fill="rgba(242, 54, 69, 0.15)" stroke="#F23645" stroke-width="1.2"/>
    <text x="170" y="104" text-anchor="middle" fill="#FF707E" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">NẾN GIẢM (BEARISH)</text>

    <!-- Nến Giảm Trục & Thân -->
    <!-- Bóng trên (Upper Shadow) -->
    <line x1="170" y1="130" x2="170" y2="190" stroke="#FF707E" stroke-width="3"/>
    <!-- Thân nến (Real Body) -->
    <rect x="135" y="190" width="70" height="150" fill="url(#bearishGrad)" rx="3" stroke="#FF707E" stroke-width="1.5"/>
    <!-- Bóng dưới (Lower Shadow) -->
    <line x1="170" y1="340" x2="170" y2="410" stroke="#FF707E" stroke-width="3"/>

    <!-- CHỈ DẪN NẾN GIẢM (BÊN TRÁI & PHẢI) -->
    <!-- High (Giá cao nhất) -->
    <line x1="170" y1="130" x2="80" y2="130" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="170" cy="130" r="4" fill="#00E5FF"/>
    <text x="70" y="127" text-anchor="end" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">HIGH (Giá Cao Nhất)</text>
    <text x="70" y="143" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Đỉnh cao nhất phiên</text>

    <!-- Bóng trên -->
    <line x1="215" y1="160" x2="260" y2="160" stroke="#F0B90B" stroke-width="1.2" marker-start="url(#arrowGold)"/>
    <text x="270" y="156" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Bóng Trên (Upper Shadow)</text>
    <text x="270" y="172" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Lực xả hàng phe Bán</text>

    <!-- Open (Giá mở cửa) -->
    <line x1="135" y1="190" x2="80" y2="190" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="135" cy="190" r="4" fill="#00E5FF"/>
    <text x="70" y="187" text-anchor="end" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">OPEN (Giá Mở Cửa)</text>
    <text x="70" y="203" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Mức giá khởi điểm (Cao)</text>

    <!-- Thân nến (Real Body) -->
    <line x1="215" y1="265" x2="260" y2="265" stroke="#F0B90B" stroke-width="1.2" marker-start="url(#arrowGold)"/>
    <text x="270" y="261" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">THÂN NẾN (Real Body)</text>
    <text x="270" y="277" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Biên độ = Open - Close</text>
    <text x="270" y="293" fill="#FF707E" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">&rarr; Phe Bán Chiếm Ưu Thế</text>

    <!-- Close (Giá đóng cửa) -->
    <line x1="135" y1="340" x2="80" y2="340" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="135" cy="340" r="4" fill="#FF707E"/>
    <text x="70" y="337" text-anchor="end" fill="#FF707E" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">CLOSE (Giá Đóng Cửa)</text>
    <text x="70" y="353" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Mức giá chốt phiên (Thấp)</text>

    <!-- Bóng dưới -->
    <line x1="215" y1="375" x2="260" y2="375" stroke="#F0B90B" stroke-width="1.2" marker-start="url(#arrowGold)"/>
    <text x="270" y="371" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Bóng Dưới (Lower Shadow)</text>
    <text x="270" y="387" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Lực cầu bắt đáy yếu ớt</text>

    <!-- Low (Giá thấp nhất) -->
    <line x1="170" y1="410" x2="80" y2="410" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="170" cy="410" r="4" fill="#00E5FF"/>
    <text x="70" y="407" text-anchor="end" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">LOW (Giá Thấp Nhất)</text>
    <text x="70" y="423" text-anchor="end" fill="#8E9BAE" font-family="'Inter', sans-serif" font-size="11">Đáy thấp nhất phiên</text>
  </g>
</svg>
