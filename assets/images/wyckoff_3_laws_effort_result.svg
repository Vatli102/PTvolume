<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" /><stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" /><stop offset="100%" stop-color="#10141D" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)" />
  <rect x="80" y="35" width="240" height="28" rx="14" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.35)" />
  <text x="200" y="54" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">PHƯƠNG PHÁP WYCKOFF • BÀI 2</text>
  <text x="80" y="95" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Ba Quy Luật Vĩnh Cửu Vận Hành Thị Trường Tài Chính</text>
  <text x="80" y="120" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Cung Cầu (Quyết định xu hướng) • Nguyên Nhân &amp; Kết Quả • Nỗ Lực vs Kết Quả (VSA)</text>

  <!-- Law 1 -->
  <g transform="translate(80, 150)">
    <rect width="360" height="490" rx="12" fill="url(#card2)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
    <rect width="360" height="48" rx="12" fill="rgba(0, 229, 255, 0.08)" />
    <text x="24" y="31" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="15" font-weight="700">1. Quy Luật Cung &amp; Cầu</text>
    <text x="24" y="80" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Cầu &gt; Cung: Giá Tăng (Uptrend)</text>
    <text x="24" y="105" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Khi người mua sẵn sàng trả giá cao hơn.</text>
    <text x="24" y="145" fill="#FF707E" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Cung &gt; Cầu: Giá Giảm (Downtrend)</text>
    <text x="24" y="170" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Khi người bán chấp nhận hạ giá để thoát hàng.</text>
    <text x="24" y="210" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Cung = Cầu: Đi Ngang (Sideway / TR)</text>
    <text x="24" y="235" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Thị trường tích lũy hoặc phân phối.</text>
    <rect x="20" y="280" width="320" height="180" rx="8" fill="#141822" stroke="#222938" />
    <text x="35" y="310" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">💡 Điểm Mấu Chốt Của Wyckoff:</text>
    <text x="35" y="340" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Không đo Cung Cầu bằng tin tức báo chí.</text>
    <text x="35" y="365" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Đo trực tiếp trên biểu đồ: Thân nến cho</text>
    <text x="35" y="390" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">thấy kết quả chuyển dịch và Khối lượng</text>
    <text x="35" y="415" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">thể hiện nỗ lực của phe tham gia.</text>
  </g>

  <!-- Law 2 -->
  <g transform="translate(460, 150)">
    <rect width="360" height="490" rx="12" fill="url(#card2)" stroke="rgba(240, 185, 11, 0.3)" stroke-width="1.5" />
    <rect width="360" height="48" rx="12" fill="rgba(240, 185, 11, 0.08)" />
    <text x="24" y="31" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="15" font-weight="700">2. Quy Luật Nguyên Nhân &amp; Kết Quả</text>
    <text x="24" y="80" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Nguyên Nhân (Cause):</text>
    <text x="24" y="105" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Là thời gian và biên độ nén trong vùng TR.</text>
    <text x="24" y="130" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Cá mập gom hàng càng lâu, nguyên nhân càng lớn.</text>
    <text x="24" y="170" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Kết Quả (Effect):</text>
    <text x="24" y="195" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Là xu hướng tăng/giảm sau khi bứt phá.</text>
    <text x="24" y="220" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Mức tăng tỷ lệ thuận với thời gian tích lũy.</text>
    <rect x="20" y="280" width="320" height="180" rx="8" fill="#141822" stroke="#222938" />
    <text x="35" y="310" fill="#F0B90B" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">💡 Ứng Dụng Trong Thực Chiến:</text>
    <text x="35" y="340" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Nền tích lũy 6 tháng sẽ tạo ra sóng tăng</text>
    <text x="35" y="365" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">xa hơn nhiều so với nền giá 1 tuần.</text>
    <text x="35" y="390" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Không bao giờ kỳ vọng lãi x2, x3 từ một</text>
    <text x="35" y="415" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">vùng tích lũy chỉ mới kéo dài vài ngày.</text>
  </g>

  <!-- Law 3 -->
  <g transform="translate(840, 150)">
    <rect width="360" height="490" rx="12" fill="url(#card2)" stroke="rgba(38, 231, 166, 0.3)" stroke-width="1.5" />
    <rect width="360" height="48" rx="12" fill="rgba(38, 231, 166, 0.08)" />
    <text x="24" y="31" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="15" font-weight="700">3. Quy Luật Nỗ Lực &amp; Kết Quả</text>
    <text x="24" y="80" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Nỗ Lực (Effort) = Khối lượng (Volume)</text>
    <text x="24" y="105" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Số lượng cổ phiếu / hợp đồng được khớp lệnh.</text>
    <text x="24" y="145" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Kết Quả (Result) = Biên độ giá (Spread)</text>
    <text x="24" y="170" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Khoảng cách di chuyển từ giá mở đến đóng cửa.</text>
    <text x="24" y="210" fill="#FF707E" font-family="'Inter', sans-serif" font-size="14" font-weight="700">• Bất Thường (Divergence):</text>
    <text x="24" y="235" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Volume cực lớn nhưng thân nến tí hon $ightarrow$ Cảnh báo bẫy!</text>
    <rect x="20" y="280" width="320" height="180" rx="8" fill="#141822" stroke="#222938" />
    <text x="35" y="310" fill="#26E7A6" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700">💡 Trọng Tâm Của Phân Tích VSA:</text>
    <text x="35" y="340" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Nếu nỗ lực khổng lồ mà giá không nhích</text>
    <text x="35" y="365" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">được lên $ightarrow$ Đang có nguồn cung đối ứng</text>
    <text x="35" y="390" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">khổng lồ dội vào đầu phe Mua (Phân phối).</text>
    <text x="35" y="415" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Đảo chiều giảm sẽ diễn ra ngay sau đó!</text>
  </g>

  <!-- Watermark -->
  <g transform="translate(1080, 675)">
    <rect width="125" height="26" rx="6" fill="rgba(11, 14, 20, 0.85)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="62" y="17" fill="#00E5FF" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">PTvolume.com</text>
  </g>
</svg>