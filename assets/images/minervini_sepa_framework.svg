<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0E14" />
            <stop offset="100%" stop-color="#141822" />
        </linearGradient>
        <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#2962FF" stop-opacity="0.1" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="900" height="520" fill="url(#bg-gradient)" rx="12" />
    <rect x="1" y="1" width="898" height="518" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

    <!-- Header / Title -->
    <text x="450" y="42" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#00E5FF" text-anchor="middle" letter-spacing="1">HỆ THỐNG SEPA® (SPECIFIC ENTRY POINT ANALYSIS)</text>
    <text x="450" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8E9BAE" text-anchor="middle">5 Trụ Cột Tuyển Chọn &amp; Giao Dịch Siêu Cổ Phiếu Của Mark Minervini</text>

    <!-- Center Core Hub -->
    <circle cx="450" cy="275" r="75" fill="#141822" stroke="#00E5FF" stroke-width="2.5" filter="url(#shadow)" />
    <circle cx="450" cy="275" r="65" fill="url(#glow-cyan)" />
    <text x="450" y="265" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">SEPA®</text>
    <text x="450" y="285" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">SUPER</text>
    <text x="450" y="300" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F0B90B" text-anchor="middle">PERFORMANCE</text>

    <!-- Connecting Lines -->
    <path d="M 450 200 L 450 125" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M 515 235 L 670 170" stroke="#089981" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M 505 320 L 670 380" stroke="#F0B90B" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M 395 320 L 230 380" stroke="#F23645" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M 385 235 L 230 170" stroke="#2962FF" stroke-width="2" stroke-dasharray="4 3" />

    <!-- 1. TREND (Top) -->
    <g transform="translate(320, 85)" filter="url(#shadow)">
        <rect width="260" height="68" rx="8" fill="#181E2B" stroke="#00E5FF" stroke-width="1.5" />
        <circle cx="28" cy="34" r="16" fill="rgba(0, 229, 255, 0.15)" />
        <text x="28" y="39" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#00E5FF" text-anchor="middle">1</text>
        <text x="56" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">XU HƯỚNG (TREND)</text>
        <text x="56" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#CAD4E0">Stage 2 Uptrend • Trend Template 8 Tiêu chí</text>
    </g>

    <!-- 2. FUNDAMENTALS (Top Right) -->
    <g transform="translate(620, 135)" filter="url(#shadow)">
        <rect width="250" height="74" rx="8" fill="#181E2B" stroke="#089981" stroke-width="1.5" />
        <circle cx="28" cy="37" r="16" fill="rgba(8, 153, 129, 0.15)" />
        <text x="28" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#089981" text-anchor="middle">2</text>
        <text x="56" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">YẾU TỐ CƠ BẢN</text>
        <text x="56" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#CAD4E0">EPS &amp; Doanh số tăng tốc 30-40%+</text>
        <text x="56" y="62" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#8E9BAE">Code 33 • Biên LN gộp mở rộng</text>
    </g>

    <!-- 3. CATALYST (Bottom Right) -->
    <g transform="translate(620, 345)" filter="url(#shadow)">
        <rect width="250" height="74" rx="8" fill="#181E2B" stroke="#F0B90B" stroke-width="1.5" />
        <circle cx="28" cy="37" r="16" fill="rgba(240, 185, 11, 0.15)" />
        <text x="28" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#F0B90B" text-anchor="middle">3</text>
        <text x="56" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">CHẤT XÚC TÁC (CATALYST)</text>
        <text x="56" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#CAD4E0">Sản phẩm mới • Hợp đồng đột phá</text>
        <text x="56" y="62" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#8E9BAE">FDA chấp thuận • Chu kỳ ngành mới</text>
    </g>

    <!-- 4. ENTRY POINT (Bottom Left) -->
    <g transform="translate(30, 345)" filter="url(#shadow)">
        <rect width="250" height="74" rx="8" fill="#181E2B" stroke="#2962FF" stroke-width="1.5" />
        <circle cx="28" cy="37" r="16" fill="rgba(41, 98, 255, 0.2)" />
        <text x="28" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#2962FF" text-anchor="middle">4</text>
        <text x="56" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">ĐIỂM MUA TỐI ƯU (ENTRY)</text>
        <text x="56" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#CAD4E0">Mẫu hình VCP • Nền giá kiến tạo</text>
        <text x="56" y="62" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#8E9BAE">Pivot Breakout + Khối lượng bùng nổ</text>
    </g>

    <!-- 5. EXIT POINT & RISK (Top Left) -->
    <g transform="translate(30, 135)" filter="url(#shadow)">
        <rect width="250" height="74" rx="8" fill="#181E2B" stroke="#F23645" stroke-width="1.5" />
        <circle cx="28" cy="37" r="16" fill="rgba(242, 54, 69, 0.15)" />
        <text x="28" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#F23645" text-anchor="middle">5</text>
        <text x="56" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">QUẢN TRỊ &amp; THOÁT LỆNH</text>
        <text x="56" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#CAD4E0">Cắt lỗ cứng 7-8% • Tỷ lệ R:R ≥ 2:1</text>
        <text x="56" y="62" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#8E9BAE">Trailing Stop • Bán khi giá chạy cao trào</text>
    </g>

    <!-- Bottom summary banner -->
    <rect x="180" y="460" width="540" height="38" rx="6" fill="#10141E" stroke="#222938" stroke-width="1"/>
    <text x="450" y="484" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#00E5FF" text-anchor="middle">
        ★ "Rủi ro thấp nhất và Xác suất sinh lời cao nhất chỉ xảy ra tại Điểm Pivot chuẩn xác" ★
    </text>
</svg>
