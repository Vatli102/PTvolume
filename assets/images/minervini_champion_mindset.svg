<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-champ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0B90B" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2962FF" />
    </linearGradient>
    <filter id="shadow-box" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bg-champ)" rx="14"/>
  <rect width="896" height="476" x="2" y="2" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

  <!-- Header -->
  <g transform="translate(450, 45)" text-anchor="middle">
    <rect x="-320" y="-22" width="640" height="42" rx="21" fill="#1A2130" stroke="rgba(240, 185, 11, 0.4)" stroke-width="1.2"/>
    <text y="5" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#F0B90B" letter-spacing="1.5">
      TƯ DUY NHÀ VÔ ĐỊCH: CHU TRÌNH HIỆU SUẤT CAO (CHAMPION CYCLE)
    </text>
    <text y="35" font-family="'Inter', sans-serif" font-size="12" fill="#8E9BAE">
      Đúc kết từ kiệt tác "Think &amp; Trade Like a Champion" - Mark Minervini
    </text>
  </g>

  <!-- 4 Pillars of Champion Trading -->
  <!-- Box 1: Preparation -->
  <g transform="translate(60, 110)" filter="url(#shadow-box)">
    <rect width="180" height="230" rx="10" fill="#141822" stroke="#2962FF" stroke-width="1.5"/>
    <rect width="180" height="38" rx="10" fill="#1A2234"/>
    <path d="M 0 28 L 0 38 L 180 38 L 180 28 Z" fill="#1A2234"/>
    <circle cx="24" cy="19" r="10" fill="#2962FF"/>
    <text x="24" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="44" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#00E5FF">CHUẨN BỊ</text>
    <text x="44" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#8E9BAE">Preparation</text>
    
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Lọc Trend Template</text>
    <text x="15" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Xây Watchlist trọng điểm</text>
    <text x="15" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Lên kịch bản Nếu - Thì</text>
    <text x="15" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Định trước mức Stop Loss</text>
    <text x="15" y="175" font-family="'Inter', sans-serif" font-size="10" fill="#F0B90B" font-style="italic">"Kế hoạch trước khi vào lệnh, không bao giờ ngẫu hứng."</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 225 L 265 225" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="265,220 275,225 265,230" fill="#00E5FF"/>

  <!-- Box 2: Execution -->
  <g transform="translate(280, 110)" filter="url(#shadow-box)">
    <rect width="180" height="230" rx="10" fill="#141822" stroke="#089981" stroke-width="1.5"/>
    <rect width="180" height="38" rx="10" fill="#132623"/>
    <path d="M 0 28 L 0 38 L 180 38 L 180 28 Z" fill="#132623"/>
    <circle cx="24" cy="19" r="10" fill="#089981"/>
    <text x="24" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="44" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#26A69A">THỰC THI</text>
    <text x="44" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#8E9BAE">Flawless Execution</text>
    
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Mua tại Pivot / Cheat</text>
    <text x="15" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Vào lệnh không do dự</text>
    <text x="15" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Kích hoạt SL tự động</text>
    <text x="15" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Progressive Exposure</text>
    <text x="15" y="175" font-family="'Inter', sans-serif" font-size="10" fill="#26A69A" font-style="italic">"Kỷ luật là cầu nối giữa mục tiêu và thành quả."</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 465 225 L 485 225" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="485,220 495,225 485,230" fill="#00E5FF"/>

  <!-- Box 3: Risk Protection -->
  <g transform="translate(500, 110)" filter="url(#shadow-box)">
    <rect width="180" height="230" rx="10" fill="#141822" stroke="#F23645" stroke-width="1.5"/>
    <rect width="180" height="38" rx="10" fill="#28171B"/>
    <path d="M 0 28 L 0 38 L 180 38 L 180 28 Z" fill="#28171B"/>
    <circle cx="24" cy="19" r="10" fill="#F23645"/>
    <text x="24" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="44" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FF5252">PHÒNG VỆ</text>
    <text x="44" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#8E9BAE">Risk Management</text>
    
    <text x="15" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Cắt lỗ ≤ 1/2 lãi TB</text>
    <text x="15" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Tuyệt đối không gồng lỗ</text>
    <text x="15" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Khóa lãi khi nổ Climax</text>
    <text x="15" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Bảo toàn vốn hàng đầu</text>
    <text x="15" y="175" font-family="'Inter', sans-serif" font-size="10" fill="#FF5252" font-style="italic">"Thua lỗ nhỏ là chi phí kinh doanh; lỗ lớn là tự sát."</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 685 225 L 705 225" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="705,220 715,225 705,230" fill="#00E5FF"/>

  <!-- Box 4: Post Analysis -->
  <g transform="translate(720, 110)" filter="url(#shadow-box)">
    <rect width="140" height="230" rx="10" fill="#141822" stroke="#F0B90B" stroke-width="1.5"/>
    <rect width="140" height="38" rx="10" fill="#252014"/>
    <path d="M 0 28 L 0 38 L 140 38 L 140 28 Z" fill="#252014"/>
    <circle cx="20" cy="19" r="10" fill="#F0B90B"/>
    <text x="20" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#000" text-anchor="middle">4</text>
    <text x="36" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F0B90B">HẬU KIỂM</text>
    <text x="36" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#8E9BAE">Post-Analysis</text>
    
    <text x="10" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Ghi chép nhật ký</text>
    <text x="10" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Đo Batting Avg</text>
    <text x="10" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Đo Win/Loss Ratio</text>
    <text x="10" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Tìm lỗi &amp; Tối ưu</text>
    <text x="10" y="175" font-family="'Inter', sans-serif" font-size="9.5" fill="#F0B90B" font-style="italic">"Nhật ký là HLV giỏi nhất."</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 790 350 L 790 380 L 150 380 L 150 350" fill="none" stroke="rgba(240, 185, 11, 0.7)" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="146,352 150,342 154,352" fill="#F0B90B"/>
  <text x="470" y="375" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F0B90B" text-anchor="middle">
    VÒNG LẶP NÂNG CẤP KỸ NĂNG LIÊN TỤC (MASTERY FEEDBACK LOOP)
  </text>

  <!-- Bottom Core Equation Banner -->
  <g transform="translate(60, 405)">
    <rect width="780" height="50" rx="8" fill="#101520" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <text x="390" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">
      CÔNG THỨC KỲ VỌNG TOÁN HỌC CỐT LÕI: Expectancy = (Win% × Win Avg) - (Loss% × Loss Avg) > 0
    </text>
    <text x="390" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#8E9BAE" text-anchor="middle">
      Chỉ cần Win Rate 40% nhưng tỷ lệ Lợi nhuận/Thua lỗ 2:1 hoặc 3:1, bạn sẽ đạt tỷ suất sinh lời vượt trội phi thường.
    </text>
  </g>

  <!-- Watermark -->
  <text x="865" y="468" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.25)" text-anchor="end">PTvolume.com</text>
</svg>
