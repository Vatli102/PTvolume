<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-champ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
    <filter id="shadow-box" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="510" fill="url(#bg-champ)" rx="14"/>
  <rect width="976" height="506" x="2" y="2" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

  <!-- Header -->
  <g transform="translate(490, 42)" text-anchor="middle">
    <rect x="-350" y="-22" width="700" height="42" rx="21" fill="#1A2130" stroke="rgba(240, 185, 11, 0.4)" stroke-width="1.2"/>
    <text y="5" font-family="'Inter', sans-serif" font-size="15.5" font-weight="800" fill="#F0B90B" letter-spacing="1.2">
      TƯ DUY NHÀ VÔ ĐỊCH: CHU TRÌNH HIỆU SUẤT CAO (CHAMPION CYCLE)
    </text>
    <text y="34" font-family="'Inter', sans-serif" font-size="12" fill="#8E9BAE">
      Đúc kết từ kiệt tác "Think &amp; Trade Like a Champion" — Mark Minervini
    </text>
  </g>

  <!-- 4 Pillars of Champion Trading -->
  <!-- Box 1: Preparation -->
  <g transform="translate(30, 105)" filter="url(#shadow-box)">
    <rect width="210" height="245" rx="10" fill="#141822" stroke="#2962FF" stroke-width="1.5"/>
    <rect width="210" height="38" rx="10" fill="#1A2234"/>
    <path d="M 0 28 L 0 38 L 210 38 L 210 28 Z" fill="#1A2234"/>
    <circle cx="22" cy="19" r="10" fill="#2962FF"/>
    <text x="22" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="40" y="24" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#00E5FF">CHUẨN BỊ</text>
    <text x="135" y="24" font-family="'Inter', sans-serif" font-size="9.5" fill="#8E9BAE">Preparation</text>
    
    <text x="14" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Lọc Trend Template</text>
    <text x="14" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Xây Focus Watchlist</text>
    <text x="14" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Lên kịch bản Nếu - Thì</text>
    <text x="14" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Định sẵn mức Stop Loss</text>
    
    <rect x="10" y="165" width="190" height="65" rx="6" fill="#0E131E" stroke="#1F283D" stroke-width="1"/>
    <text x="105" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F0B90B" text-anchor="middle">TRIẾT LÝ CỐT LÕI:</text>
    <text x="105" y="204" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">Lên kế hoạch trước,</text>
    <text x="105" y="218" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">không giao dịch ngẫu hứng.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 246 225 L 264 225" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="264,220 270,225 264,230" fill="#00E5FF"/>

  <!-- Box 2: Execution -->
  <g transform="translate(275, 105)" filter="url(#shadow-box)">
    <rect width="210" height="245" rx="10" fill="#141822" stroke="#089981" stroke-width="1.5"/>
    <rect width="210" height="38" rx="10" fill="#132623"/>
    <path d="M 0 28 L 0 38 L 210 38 L 210 28 Z" fill="#132623"/>
    <circle cx="22" cy="19" r="10" fill="#089981"/>
    <text x="22" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="40" y="24" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#26A69A">THỰC THI</text>
    <text x="135" y="24" font-family="'Inter', sans-serif" font-size="9.5" fill="#8E9BAE">Execution</text>
    
    <text x="14" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Mua tại Pivot / Cheat</text>
    <text x="14" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Vào lệnh dứt khoát</text>
    <text x="14" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Cài Stop Loss tự động</text>
    <text x="14" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Đi vốn Progressive</text>
    
    <rect x="10" y="165" width="190" height="65" rx="6" fill="#0D1A18" stroke="#183630" stroke-width="1"/>
    <text x="105" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#26A69A" text-anchor="middle">TRIẾT LÝ CỐT LÕI:</text>
    <text x="105" y="204" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">Kỷ luật sắt đá là cầu nối</text>
    <text x="105" y="218" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">giữa mục tiêu và thành quả.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 491 225 L 509 225" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="509,220 515,225 509,230" fill="#00E5FF"/>

  <!-- Box 3: Risk Protection -->
  <g transform="translate(520, 105)" filter="url(#shadow-box)">
    <rect width="210" height="245" rx="10" fill="#141822" stroke="#F23645" stroke-width="1.5"/>
    <rect width="210" height="38" rx="10" fill="#28171B"/>
    <path d="M 0 28 L 0 38 L 210 38 L 210 28 Z" fill="#28171B"/>
    <circle cx="22" cy="19" r="10" fill="#F23645"/>
    <text x="22" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="40" y="24" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#FF5252">PHÒNG VỆ</text>
    <text x="135" y="24" font-family="'Inter', sans-serif" font-size="9.5" fill="#8E9BAE">Protection</text>
    
    <text x="14" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Cắt lỗ ≤ 1/2 lãi TB</text>
    <text x="14" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Tuyệt đối không gồng lỗ</text>
    <text x="14" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Khóa lãi khi nổ Climax</text>
    <text x="14" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Giữ an toàn vốn gốc</text>
    
    <rect x="10" y="165" width="190" height="65" rx="6" fill="#1E1215" stroke="#3A1C22" stroke-width="1"/>
    <text x="105" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FF5252" text-anchor="middle">TRIẾT LÝ CỐT LÕI:</text>
    <text x="105" y="204" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">Thua lỗ nhỏ là chi phí;</text>
    <text x="105" y="218" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">Lỗ lớn là tự sát tài chính.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 736 225 L 754 225" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="754,220 760,225 754,230" fill="#00E5FF"/>

  <!-- Box 4: Post Analysis -->
  <g transform="translate(765, 105)" filter="url(#shadow-box)">
    <rect width="185" height="245" rx="10" fill="#141822" stroke="#F0B90B" stroke-width="1.5"/>
    <rect width="185" height="38" rx="10" fill="#252014"/>
    <path d="M 0 28 L 0 38 L 185 38 L 185 28 Z" fill="#252014"/>
    <circle cx="20" cy="19" r="10" fill="#F0B90B"/>
    <text x="20" y="23" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#000" text-anchor="middle">4</text>
    <text x="38" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F0B90B">HẬU KIỂM</text>
    <text x="120" y="24" font-family="'Inter', sans-serif" font-size="9" fill="#8E9BAE">Analysis</text>
    
    <text x="12" y="65" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Ghi nhật ký đầy đủ</text>
    <text x="12" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Đo Batting Average</text>
    <text x="12" y="115" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Đo Win/Loss Ratio</text>
    <text x="12" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#CAD4E0" font-weight="600">• Tìm lỗi &amp; Tối ưu hóa</text>
    
    <rect x="8" y="165" width="169" height="65" rx="6" fill="#1C180F" stroke="#382E18" stroke-width="1"/>
    <text x="92" y="186" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F0B90B" text-anchor="middle">TRIẾT LÝ CỐT LÕI:</text>
    <text x="92" y="204" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">Nhật ký là huấn luyện</text>
    <text x="92" y="218" font-family="'Inter', sans-serif" font-size="9.5" fill="#CAD4E0" text-anchor="middle">viên giỏi nhất của bạn.</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 855 355 L 855 385 L 135 385 L 135 355" fill="none" stroke="rgba(240, 185, 11, 0.7)" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="131,357 135,347 139,357" fill="#F0B90B"/>
  <text x="490" y="380" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F0B90B" text-anchor="middle">
    VÒNG LẶP NÂNG CẤP KỸ NĂNG LIÊN TỤC (MASTERY FEEDBACK LOOP)
  </text>

  <!-- Bottom Core Equation Banner -->
  <g transform="translate(40, 410)">
    <rect width="780" height="48" rx="8" fill="#101520" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <text x="390" y="21" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#00E5FF" text-anchor="middle">
      CÔNG THỨC KỲ VỌNG TOÁN HỌC: Expectancy = (Win% × Win Avg) - (Loss% × Loss Avg) > 0
    </text>
    <text x="390" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#8E9BAE" text-anchor="middle">
      Chỉ cần Win Rate 40% nhưng tỷ lệ Lãi/Lỗ 2:1 hoặc 3:1, bạn sẽ đạt tỷ suất sinh lời vượt trội phi thường.
    </text>
  </g>
</svg>
