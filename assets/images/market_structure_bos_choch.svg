<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-ms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <filter id="shadow-ms" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="680" fill="url(#bg-ms)" rx="16"/>
  <rect width="1094" height="674" x="3" y="3" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- HEADER -->
  <g transform="translate(550, 48)" text-anchor="middle">
    <rect x="-460" y="-26" width="920" height="52" rx="26" fill="#141926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.8"/>
    <text y="7" font-size="19" font-weight="800" fill="#00E5FF" letter-spacing="0.8">
      CẤU TRÚC THỊ TRƯỜNG NGUYÊN BẢN: ĐỈNH/ĐÁY SWING, BOS &amp; CHoCH
    </text>
    <text y="42" font-size="13" fill="#8E9BAE">
      Khóa Học Naked Chart, VSA &amp; Phương Pháp Wyckoff Thực Chiến • PTvolume.com
    </text>
  </g>

  <!-- DIAGRAM CANVAS -->
  <g transform="translate(50, 115)" filter="url(#shadow-ms)">
    <rect width="1000" height="490" rx="14" fill="#0F141F" stroke="#222938" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="40" y1="120" x2="960" y2="120" stroke="#182030" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="40" y1="240" x2="960" y2="240" stroke="#182030" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="40" y1="360" x2="960" y2="360" stroke="#182030" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- FLIP ZONE HIGHLIGHT -->
    <rect x="250" y="225" width="680" height="35" fill="rgba(240, 185, 11, 0.1)" stroke="rgba(240, 185, 11, 0.4)" stroke-dasharray="4,4" rx="4"/>
    <text x="915" y="247" font-size="11" font-weight="700" fill="#F0B90B" text-anchor="end">VÙNG CHUYỂN ĐỔI (FLIP ZONE: HỖ TRỢ &lt;-&gt; KHÁNG CỰ)</text>

    <!-- UPTREND PHASE -->
    <!-- Low 1 -> High 1 -->
    <line x1="70" y1="380" x2="180" y2="240" stroke="#089981" stroke-width="4"/>
    <!-- High 1 -> Higher Low 1 -->
    <line x1="180" y1="240" x2="250" y2="320" stroke="#CAD4E0" stroke-width="3"/>
    <!-- Higher Low 1 -> Higher High 1 (BOS 1) -->
    <line x1="250" y1="320" x2="390" y2="150" stroke="#089981" stroke-width="4"/>
    <!-- Higher High 1 -> Higher Low 2 (Retest at Flip Zone) -->
    <line x1="390" y1="150" x2="470" y2="240" stroke="#CAD4E0" stroke-width="3"/>
    <!-- Higher Low 2 -> Higher High 2 (BOS 2 / Peak) -->
    <line x1="470" y1="240" x2="610" y2="90" stroke="#089981" stroke-width="4"/>

    <!-- BOS 1 line -->
    <line x1="180" y1="240" x2="350" y2="240" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="265" y="210" width="60" height="20" rx="3" fill="#0B0E14" stroke="#00E5FF" stroke-width="1"/>
    <text x="295" y="224" font-size="10" font-weight="800" fill="#00E5FF" text-anchor="middle">BOS 1</text>

    <!-- BOS 2 line -->
    <line x1="390" y1="150" x2="560" y2="150" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="475" y="125" width="60" height="20" rx="3" fill="#0B0E14" stroke="#00E5FF" stroke-width="1"/>
    <text x="505" y="139" font-size="10" font-weight="800" fill="#00E5FF" text-anchor="middle">BOS 2</text>

    <!-- CHoCH (CHANGE OF CHARACTER / REVERSAL) -->
    <!-- Peak -> Lower Low (Breaks HL2) -->
    <line x1="610" y1="90" x2="720" y2="290" stroke="#F23645" stroke-width="4"/>
    
    <!-- CHoCH line across HL2 -->
    <line x1="470" y1="240" x2="710" y2="240" stroke="#F23645" stroke-width="1.8" stroke-dasharray="3,3"/>
    <rect x="580" y="248" width="100" height="22" rx="4" fill="#201014" stroke="#F23645" stroke-width="1.2"/>
    <text x="630" y="263" font-size="10.5" font-weight="900" fill="#FF707E" text-anchor="middle">CHoCH (GÃY CẤU TRÚC)</text>

    <!-- DOWNTREND PHASE -->
    <!-- Pullback to Flip Zone -> Lower High -->
    <line x1="720" y1="290" x2="810" y2="240" stroke="#CAD4E0" stroke-width="3"/>
    <!-- Lower High -> Lower Low (Downtrend Continuation) -->
    <line x1="810" y1="240" x2="940" y2="410" stroke="#F23645" stroke-width="4"/>

    <!-- Point Markers -->
    <!-- Low 1 -->
    <circle cx="70" cy="380" r="7" fill="#089981"/>
    <text x="70" y="405" font-size="12" font-weight="700" fill="#089981" text-anchor="middle">Low (Đáy)</text>

    <!-- High 1 -->
    <circle cx="180" cy="240" r="7" fill="#089981"/>
    <text x="180" y="222" font-size="12" font-weight="700" fill="#089981" text-anchor="middle">High</text>

    <!-- HL 1 -->
    <circle cx="250" cy="320" r="7" fill="#089981"/>
    <text x="250" y="345" font-size="12" font-weight="700" fill="#26E7A6" text-anchor="middle">HL 1 (Đáy cao hơn)</text>

    <!-- HH 1 -->
    <circle cx="390" cy="150" r="7" fill="#089981"/>
    <text x="390" y="132" font-size="12" font-weight="700" fill="#26E7A6" text-anchor="middle">HH 1 (Đỉnh cao hơn)</text>

    <!-- HL 2 -->
    <circle cx="470" cy="240" r="8" fill="#00E5FF"/>
    <text x="470" y="280" font-size="12" font-weight="800" fill="#00E5FF" text-anchor="middle">HL 2 (Mốc Then Chốt)</text>

    <!-- Peak HH 2 -->
    <circle cx="610" cy="90" r="8" fill="#F0B90B"/>
    <text x="610" y="70" font-size="13" font-weight="900" fill="#F0B90B" text-anchor="middle">ĐỈNH CHU KỲ (PEAK)</text>

    <!-- LL 1 -->
    <circle cx="720" cy="290" r="7" fill="#F23645"/>
    <text x="720" y="315" font-size="12" font-weight="700" fill="#F23645" text-anchor="middle">LL (Đáy thấp hơn)</text>

    <!-- LH 1 (Sniper Sell Entry) -->
    <circle cx="810" cy="240" r="9" fill="#F23645" stroke="#FFFFFF" stroke-width="2"/>
    <text x="810" y="215" font-size="12.5" font-weight="800" fill="#FF707E" text-anchor="middle">LH (ĐIỂM SELL BẮN TỈA)</text>
    <rect x="745" y="172" width="130" height="24" rx="4" fill="#261217" stroke="#F23645"/>
    <text x="810" y="188" font-size="10" font-weight="800" fill="#FF707E" text-anchor="middle">Retest Flip Zone + Pin Bar</text>

    <!-- LL 2 -->
    <circle cx="940" cy="410" r="7" fill="#F23645"/>
    <text x="940" y="435" font-size="12" font-weight="700" fill="#FF707E" text-anchor="middle">LL 2</text>
  </g>

  <!-- FOOTER WATERMARK -->
  <g transform="translate(550, 645)" text-anchor="middle">
    <text font-size="12.5" fill="#CAD4E0" font-weight="600">
      Đóng dấu bản quyền: <tspan fill="#00E5FF" font-weight="800">PTvolume.com</tspan> • Chuyên Trang Naked Chart, VSA &amp; Phương Pháp Wyckoff
    </text>
  </g>
</svg>