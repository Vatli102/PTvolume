<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-chart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <filter id="shadow-box" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="url(#bg-chart)" rx="14"/>
  <rect width="994" height="544" x="3" y="3" fill="none" stroke="#222938" stroke-width="1.8" rx="12"/>

  <!-- Header -->
  <g transform="translate(500, 38)" text-anchor="middle">
    <rect x="-420" y="-22" width="840" height="44" rx="22" fill="#141926" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.5"/>
    <text y="6" font-size="16" font-weight="800" fill="#00E5FF" letter-spacing="0.6">
      BIÊN AN TOÀN TRONG HÀNH ĐỘNG GIÁ &amp; DÒNG TIỀN (NAKED CHART • VSA • WYCKOFF)
    </text>
    <text y="36" font-size="12" fill="#8E9BAE">
      Kết nối triết lý Biên An Toàn của Warren Buffett với Điểm Spring cạn kiệt Volume của Smart Money
    </text>
  </g>

  <!-- Chart Grid -->
  <line x1="60" y1="120" x2="940" y2="120" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="210" x2="940" y2="210" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="300" x2="940" y2="300" stroke="#1F2636" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="60" y1="390" x2="940" y2="390" stroke="#2A354A" stroke-width="1.5"/>

  <!-- Support & Resistance Bands -->
  <!-- Resistance Level -->
  <line x1="120" y1="160" x2="720" y2="160" stroke="#F0B90B" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="230" y="142" width="200" height="20" rx="4" fill="#1D2230" stroke="#F0B90B" stroke-width="1"/>
  <text x="330" y="156" font-size="10" font-weight="700" fill="#F0B90B" text-anchor="middle">VÙNG KHÁNG CỰ (RESISTANCE)</text>

  <!-- Support Level -->
  <line x1="120" y1="300" x2="720" y2="300" stroke="#2962FF" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="230" y="304" width="180" height="20" rx="4" fill="#141C30" stroke="#2962FF" stroke-width="1"/>
  <text x="320" y="318" font-size="10" font-weight="700" fill="#00E5FF" text-anchor="middle">VÙNG HỖ TRỢ (SUPPORT)</text>

  <!-- PRICE ACTION WAVE PATH -->
  <!-- Phase A: Downtrend into Selling Climax -->
  <path d="M 80 140 L 140 280 L 180 230 L 220 300" fill="none" stroke="#8E9BAE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Phase B: Consolidation inside Trading Range -->
  <path d="M 220 300 L 270 170 L 330 280 L 380 180 L 440 295" fill="none" stroke="#8E9BAE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Phase C: The Spring (Dips below support then snaps back) -->
  <path d="M 440 295 L 480 345 L 520 270" fill="none" stroke="#26E7A6" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Phase D & E: Markup Rally -->
  <path d="M 520 270 L 580 160 L 620 185 L 700 110 L 760 85" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>

  <!-- Buying Climax at top right -->
  <path d="M 760 85 L 820 60 L 860 130 L 920 250" fill="none" stroke="#F23645" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2"/>

  <!-- ANNOTATION 1: DANGER ZONE (BUYING CLIMAX) -->
  <g transform="translate(740, 50)" filter="url(#shadow-box)">
    <rect width="220" height="95" rx="8" fill="#1C0D11" stroke="#F23645" stroke-width="1.5"/>
    <text x="14" y="24" font-size="12" font-weight="800" fill="#FF5252">❌ BẪY FOMO BUYING CLIMAX</text>
    <text x="14" y="44" font-size="10.5" fill="#CAD4E0">• Đám đông hưng phấn mua đuổi đỉnh</text>
    <text x="14" y="62" font-size="10.5" fill="#CAD4E0">• P/E quá cao, Volume siêu to</text>
    <text x="14" y="80" font-size="11" font-weight="700" fill="#FF5252">➔ BIÊN AN TOÀN = 0 (Rủi ro cực đại)</text>
  </g>

  <!-- ANNOTATION 2: THE SPRING / SHAKEOUT (SAFETY ZONE) -->
  <g transform="translate(410, 360)" filter="url(#shadow-box)">
    <rect width="255" height="110" rx="8" fill="#0C1B17" stroke="#089981" stroke-width="2"/>
    <circle cx="20" cy="22" r="10" fill="#089981"/>
    <text x="20" y="26" font-size="11" font-weight="900" fill="#FFF" text-anchor="middle">✓</text>
    <text x="36" y="26" font-size="12.5" font-weight="800" fill="#26E7A6">VÙNG BIÊN AN TOÀN TỐI THƯỢNG</text>
    <text x="14" y="48" font-size="10.8" fill="#CAD4E0">• Cú rũ bỏ Spring thủng Hỗ trợ giả</text>
    <text x="14" y="66" font-size="10.8" fill="#CAD4E0">• Volume cạn kiệt (No Supply Test)</text>
    <text x="14" y="84" font-size="10.8" fill="#00E5FF" font-weight="600">• Tỷ lệ Risk/Reward (R:R) ≥ 1:4</text>
    <text x="14" y="101" font-size="10.5" fill="#F0B90B" font-weight="700">• Stop Loss cực ngắn ngay dưới râu nến</text>
  </g>
  <!-- Arrow pointing to Spring -->
  <line x1="490" y1="360" x2="480" y2="348" stroke="#26E7A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VOLUME SECTION AT BOTTOM -->
  <rect x="60" y="405" width="880" height="75" rx="6" fill="#0E121B" stroke="#1F2636"/>
  <text x="75" y="424" font-size="10.5" font-weight="700" fill="#8E9BAE">KHỐI LƯỢNG GIAO DỊCH (VSA VOLUME PROFILE):</text>

  <!-- Volume Bars -->
  <!-- Phase A/B normal volume -->
  <rect x="90" y="440" width="12" height="35" fill="#F23645"/>
  <rect x="110" y="450" width="12" height="25" fill="#089981"/>
  <rect x="135" y="435" width="12" height="40" fill="#F23645"/>
  <rect x="180" y="455" width="12" height="20" fill="#8E9BAE"/>
  <rect x="220" y="445" width="12" height="30" fill="#F23645"/>
  <rect x="270" y="455" width="12" height="20" fill="#089981"/>
  <rect x="330" y="460" width="12" height="15" fill="#8E9BAE"/>
  <rect x="380" y="465" width="12" height="10" fill="#8E9BAE"/>

  <!-- Spring Dry Up Volume (Tiny) -->
  <rect x="475" y="468" width="14" height="7" fill="#26E7A6" stroke="#00E5FF"/>
  <text x="482" y="435" font-size="10" font-weight="800" fill="#26E7A6" text-anchor="middle">Volume Cạn Kiệt!</text>
  <text x="482" y="447" font-size="9" fill="#8E9BAE" text-anchor="middle">(No Supply)</text>

  <!-- Markup increasing volume -->
  <rect x="530" y="450" width="12" height="25" fill="#089981"/>
  <rect x="580" y="435" width="12" height="40" fill="#089981"/>
  <rect x="630" y="445" width="12" height="30" fill="#089981"/>
  <rect x="700" y="425" width="12" height="50" fill="#089981"/>
  
  <!-- Buying Climax Ultra Volume -->
  <rect x="815" y="415" width="16" height="60" fill="#F23645"/>
  <text x="823" y="408" font-size="10" font-weight="800" fill="#FF5252" text-anchor="middle">Ultra-High Vol!</text>

  <!-- Bottom Synthesis text -->
  <g transform="translate(50, 515)">
    <text x="450" y="16" font-size="11.5" fill="#CAD4E0" text-anchor="middle">
      <tspan fill="#F0B90B" font-weight="700">Quy tắc vàng PTvolume:</tspan> Không bao giờ mua khi đám đông nổ Volume hưng phấn; chỉ giải ngân khi Smart Money hoàn tất rũ bỏ cạn Volume.
    </text>
  </g>
</svg>
