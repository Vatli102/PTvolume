<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bg-cheat)" rx="14"/>
  <rect width="956" height="516" x="2" y="2" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

  <!-- Title Section -->
  <g transform="translate(480, 38)" text-anchor="middle">
    <rect x="-360" y="-20" width="720" height="40" rx="20" fill="#1A2130" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.2"/>
    <text y="5" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#00E5FF" letter-spacing="1">
      KỸ THUẬT VÀO LỆNH SỚM: ĐIỂM MUA CHEAT (CHEAT ENTRY &amp; PIVOT)
    </text>
    <text y="32" font-family="'Inter', sans-serif" font-size="12" fill="#8E9BAE">
      Tối ưu Tỷ lệ Lợi Nhuận / Rủi Ro (R:R) và Hạn chế Rủi ro Mua Đuổi — Mark Minervini
    </text>
  </g>

  <!-- Main Chart Area -->
  <g transform="translate(50, 88)">
    <!-- Chart Grid Background -->
    <rect width="860" height="280" rx="8" fill="#10141E" stroke="#1F2636" stroke-width="1"/>
    
    <!-- Grid horizontal lines -->
    <line x1="0" y1="70" x2="860" y2="70" stroke="#19202E" stroke-dasharray="4,4"/>
    <line x1="0" y1="140" x2="860" y2="140" stroke="#19202E" stroke-dasharray="4,4"/>
    <line x1="0" y1="210" x2="860" y2="210" stroke="#19202E" stroke-dasharray="4,4"/>

    <!-- Left High (Base High) Level Line -->
    <line x1="80" y1="55" x2="800" y2="55" stroke="rgba(242, 54, 69, 0.45)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="805" y="59" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FF5252">Đỉnh cũ nền giá</text>

    <!-- Price Path (Cup + Cheat setup) -->
    <!-- Prior Uptrend -->
    <path d="M 25 180 L 55 110 L 90 55" fill="none" stroke="#26A69A" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left side of base (correction) -->
    <path d="M 90 55 C 145 65, 190 210, 290 220" fill="none" stroke="#CAD4E0" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#8E9BAE" text-anchor="middle">Hiệu chỉnh nền giá (-25%)</text>

    <!-- Bottom rounding -->
    <path d="M 290 220 C 350 225, 410 195, 470 135" fill="none" stroke="#CAD4E0" stroke-width="3" stroke-linecap="round"/>
    <text x="350" y="245" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F0B90B" text-anchor="middle">Đáy Bo Tròn (Bottom Low)</text>

    <!-- The CHEAT Area: Mini contraction inside base (Handle-within-base) -->
    <path d="M 470 135 C 495 130, 515 150, 540 152 C 565 154, 585 140, 605 132" fill="none" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Cheat Level Line -->
    <line x1="470" y1="132" x2="640" y2="132" stroke="#F0B90B" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- Cheat Entry Point Marker -->
    <circle cx="605" cy="132" r="7" fill="#00E5FF" stroke="#fff" stroke-width="2"/>
    
    <!-- Callout for Cheat Entry -->
    <g transform="translate(605, 95)" text-anchor="middle">
      <rect x="-85" y="-22" width="170" height="26" rx="6" fill="#1A273C" stroke="#00E5FF" stroke-width="1.2"/>
      <text y="-5" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00E5FF">★ ĐIỂM MUA CHEAT</text>
    </g>
    <line x1="605" y1="100" x2="605" y2="122" stroke="#00E5FF" stroke-width="1.5"/>

    <!-- Cheat Stop Loss Level -->
    <line x1="510" y1="155" x2="640" y2="155" stroke="#F23645" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="648" y="159" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F23645">SL Chặt (-3% đến -4%)</text>

    <!-- Subsequent advance to Old Base High -->
    <path d="M 605 132 L 665 90 L 725 55" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Conventional Breakout Point -->
    <circle cx="725" cy="55" r="6" fill="#F0B90B" stroke="#fff" stroke-width="1.8"/>
    <g transform="translate(725, 20)" text-anchor="middle">
      <rect x="-75" y="-18" width="150" height="24" rx="5" fill="#252014" stroke="#F0B90B" stroke-width="1.2"/>
      <text y="-2" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#F0B90B">Điểm Mua Chuẩn (Breakout)</text>
    </g>

    <!-- Continuation Rocket -->
    <path d="M 725 55 L 785 25 L 835 10" fill="none" stroke="#26A69A" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="835,10 825,16 830,23" fill="#26A69A"/>
    <text x="795" y="40" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#26A69A">STAGE 2 ROCKET</text>

    <!-- Volume Bars Section -->
    <g transform="translate(0, 285)">
      <rect width="860" height="85" rx="6" fill="#0C1017" stroke="#19202E" stroke-width="1"/>
      <text x="15" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#8E9BAE">KHỐI LƯỢNG (VOLUME ANALYSIS)</text>

      <!-- Vol left side (selling) -->
      <rect x="80" y="45" width="15" height="35" fill="rgba(242, 54, 69, 0.7)"/>
      <rect x="100" y="35" width="15" height="45" fill="rgba(242, 54, 69, 0.8)"/>
      <rect x="120" y="50" width="15" height="30" fill="rgba(242, 54, 69, 0.6)"/>

      <!-- Vol bottom (drying up) -->
      <rect x="280" y="65" width="13" height="15" fill="rgba(142, 155, 174, 0.5)"/>
      <rect x="300" y="68" width="13" height="12" fill="rgba(142, 155, 174, 0.5)"/>
      <rect x="320" y="66" width="13" height="14" fill="rgba(142, 155, 174, 0.5)"/>

      <!-- Vol Cheat Dry-Up (VDU) -->
      <rect x="520" y="70" width="15" height="10" fill="#00E5FF" opacity="0.4"/>
      <rect x="540" y="72" width="15" height="8" fill="#00E5FF" opacity="0.4"/>
      <text x="530" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00E5FF" text-anchor="middle">VDU (Cạn Cung)</text>

      <!-- Vol Cheat Breakout -->
      <rect x="600" y="25" width="18" height="55" fill="#00E5FF"/>
      <text x="609" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#00E5FF" text-anchor="middle">Vol Nổ Lớn</text>

      <!-- Vol Standard Breakout -->
      <rect x="720" y="15" width="20" height="65" fill="#089981"/>
    </g>
  </g>

  <!-- Bottom Comparison Cards -->
  <g transform="translate(50, 465)">
    <rect width="400" height="42" rx="6" fill="#141E28" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="10.8" font-weight="700" fill="#00E5FF">
      ✔ Ưu Điểm: Mua thấp hơn 5-15%, Stop Loss cực chặt (-3% đến -5%).
    </text>
  </g>
  <g transform="translate(470, 465)">
    <rect width="360" height="42" rx="6" fill="#1E1924" stroke="rgba(240, 185, 11, 0.3)" stroke-width="1"/>
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="10.8" font-weight="700" fill="#F0B90B">
      ✔ Điều Kiện: Đáy bo tròn vững chắc + Khối lượng cạn kiệt (VDU).
    </text>
  </g>
</svg>
