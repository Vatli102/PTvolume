<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0F131D" />
    </linearGradient>
    <linearGradient id="bull-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#089981" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="shadow-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" fill="url(#bg-cheat)" rx="14"/>
  <rect width="916" height="516" x="2" y="2" fill="none" stroke="#222938" stroke-width="1.5" rx="12"/>

  <!-- Title Section -->
  <g transform="translate(460, 40)" text-anchor="middle">
    <rect x="-350" y="-20" width="700" height="40" rx="20" fill="#1A2130" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.2"/>
    <text y="5" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#00E5FF" letter-spacing="1">
      KỸ THUẬT VÀO LỆNH SỚM: ĐIỂM MUA CHEAT (CHEAT ENTRY &amp; PIVOT)
    </text>
    <text y="32" font-family="'Inter', sans-serif" font-size="12" fill="#8E9BAE">
      Tối ưu Tỷ lệ Lợi Nhuận / Rủi Ro (R:R) và Hạn chế Rủi ro Mua Đuổi theo Mark Minervini
    </text>
  </g>

  <!-- Main Chart Area -->
  <g transform="translate(60, 90)">
    <!-- Chart Grid Background -->
    <rect width="800" height="280" rx="8" fill="#10141E" stroke="#1F2636" stroke-width="1"/>
    
    <!-- Grid horizontal lines -->
    <line x1="0" y1="70" x2="800" y2="70" stroke="#19202E" stroke-dasharray="4,4"/>
    <line x1="0" y1="140" x2="800" y2="140" stroke="#19202E" stroke-dasharray="4,4"/>
    <line x1="0" y1="210" x2="800" y2="210" stroke="#19202E" stroke-dasharray="4,4"/>

    <!-- Left High (Base High) Level Line -->
    <line x1="70" y1="55" x2="750" y2="55" stroke="rgba(242, 54, 69, 0.5)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="760" y="59" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FF5252">Đỉnh cũ nền giá</text>

    <!-- Price Path (Cup + Cheat setup) -->
    <!-- Prior Uptrend -->
    <path d="M 20 180 L 50 110 L 80 55" fill="none" stroke="#26A69A" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left side of base (correction) -->
    <path d="M 80 55 C 130 65, 170 210, 260 220" fill="none" stroke="#CAD4E0" stroke-width="3" stroke-linecap="round"/>
    <text x="170" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#8E9BAE" text-anchor="middle">Hiệu chỉnh nền giá (-25%)</text>

    <!-- Bottom rounding -->
    <path d="M 260 220 C 310 225, 360 200, 420 135" fill="none" stroke="#CAD4E0" stroke-width="3" stroke-linecap="round"/>
    <text x="310" y="245" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F0B90B" text-anchor="middle">Đáy Bo Tròn (Bottom Low)</text>

    <!-- The CHEAT Area: Mini contraction inside base (Handle-within-base) -->
    <path d="M 420 135 C 445 130, 460 148, 480 152 C 500 155, 520 140, 540 132" fill="none" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Cheat Level Line -->
    <line x1="420" y1="132" x2="580" y2="132" stroke="#F0B90B" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- Cheat Entry Point Marker -->
    <circle cx="540" cy="132" r="7" fill="#00E5FF" stroke="#fff" stroke-width="2"/>
    
    <!-- Callout for Cheat Entry -->
    <g transform="translate(540, 95)" text-anchor="middle">
      <rect x="-85" y="-22" width="170" height="26" rx="6" fill="#1A273C" stroke="#00E5FF" stroke-width="1.2"/>
      <text y="-5" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00E5FF">★ ĐIỂM MUA CHEAT</text>
    </g>
    <line x1="540" y1="100" x2="540" y2="122" stroke="#00E5FF" stroke-width="1.5"/>

    <!-- Cheat Stop Loss Level -->
    <line x1="460" y1="155" x2="580" y2="155" stroke="#F23645" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="590" y="159" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F23645">SL Chặt (-3% đến -4%)</text>

    <!-- Subsequent advance to Old Base High -->
    <path d="M 540 132 L 600 90 L 660 55" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Conventional Breakout Point -->
    <circle cx="660" cy="55" r="6" fill="#F0B90B" stroke="#fff" stroke-width="1.8"/>
    <g transform="translate(660, 20)" text-anchor="middle">
      <rect x="-75" y="-18" width="150" height="24" rx="5" fill="#252014" stroke="#F0B90B" stroke-width="1.2"/>
      <text y="-2" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#F0B90B">Điểm Mua Chuẩn (Breakout)</text>
    </g>

    <!-- Continuation Rocket -->
    <path d="M 660 55 L 720 25 L 780 10" fill="none" stroke="#26A69A" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="780,10 770,16 775,23" fill="#26A69A"/>
    <text x="745" y="38" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#26A69A">STAGE 2 ROCKET</text>

    <!-- Volume Bars Section -->
    <g transform="translate(0, 285)">
      <rect width="800" height="85" rx="6" fill="#0C1017" stroke="#19202E" stroke-width="1"/>
      <text x="15" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#8E9BAE">KHỐI LƯỢNG (VOLUME ANALYSIS)</text>

      <!-- Vol left side (selling) -->
      <rect x="70" y="45" width="14" height="35" fill="rgba(242, 54, 69, 0.7)"/>
      <rect x="90" y="35" width="14" height="45" fill="rgba(242, 54, 69, 0.8)"/>
      <rect x="110" y="50" width="14" height="30" fill="rgba(242, 54, 69, 0.6)"/>

      <!-- Vol bottom (drying up) -->
      <rect x="250" y="65" width="12" height="15" fill="rgba(142, 155, 174, 0.5)"/>
      <rect x="270" y="68" width="12" height="12" fill="rgba(142, 155, 174, 0.5)"/>
      <rect x="290" y="66" width="12" height="14" fill="rgba(142, 155, 174, 0.5)"/>

      <!-- Vol Cheat Dry-Up (VDU) -->
      <rect x="460" y="70" width="14" height="10" fill="#00E5FF" opacity="0.4"/>
      <rect x="480" y="72" width="14" height="8" fill="#00E5FF" opacity="0.4"/>
      <text x="470" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00E5FF" text-anchor="middle">VDU (Cạn Cung Cực Đại)</text>

      <!-- Vol Cheat Breakout -->
      <rect x="535" y="25" width="16" height="55" fill="#00E5FF"/>
      <text x="543" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#00E5FF" text-anchor="middle">Vol Nổ Lớn</text>

      <!-- Vol Standard Breakout -->
      <rect x="655" y="15" width="18" height="65" fill="#089981"/>
    </g>
  </g>

  <!-- Bottom Comparison Cards -->
  <g transform="translate(60, 470)">
    <rect width="385" height="38" rx="6" fill="#141E28" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <text x="15" y="24" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#00E5FF">
      ✔ Ưu Điểm Cheat Entry: Mua thấp hơn 5-15%, SL cực hẹp (-3%), Tỷ lệ R:R vượt trội.
    </text>
  </g>
  <g transform="translate(475, 470)">
    <rect width="385" height="38" rx="6" fill="#1E1924" stroke="rgba(240, 185, 11, 0.3)" stroke-width="1"/>
    <text x="15" y="24" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#F0B90B">
      ✔ Điều Kiện Cốt Lõi: Phải xuất hiện sau đợt cạn kiệt Vol (VDU) và đáy bo tròn vững chắc.
    </text>
  </g>

  <!-- Watermark -->
  <text x="880" y="508" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.25)" text-anchor="end">PTvolume.com</text>
</svg>
