<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#0B0E14;">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2962FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#bgGrad9)"/>
  <rect x="25" y="25" width="950" height="570" rx="16" fill="#141822" stroke="#222938" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="50" y="65" fill="#F23645" font-family="Inter, sans-serif" font-size="20" font-weight="800" letter-spacing="1">CƠ CHẾ PHÁ BĂNG (BREAK OF ICE) &amp; ĐIỂM BÁN THỰC CHIẾN LPSY</text>
  <text x="50" y="90" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="13">Đường băng hỗ trợ (ICE), Cú đục sàn bạo lực, Nhịp hồi phục yếu ớt và Quá trình Tái Phân Phối</text>

  <!-- Ice Water Zone -->
  <rect x="60" y="220" width="880" height="40" fill="url(#iceGrad)" rx="4"/>
  <!-- ICE Line -->
  <line x1="50" y1="240" x2="950" y2="240" stroke="#00E5FF" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="60" y="210" fill="#00E5FF" font-family="Inter, sans-serif" font-size="14" font-weight="800">ĐƯỜNG BĂNG HỖ TRỢ (ICE LINE / SUPPORT CRITICAL)</text>

  <!-- Price Action Curve -->
  <path d="M 70,140 Q 120,110 160,130 T 220,238 Q 260,160 310,140 T 380,238 Q 420,170 470,160 T 520,238 Q 550,260 590,360 T 640,380 Q 680,310 720,242 T 760,248 Q 800,320 850,440 T 930,500" fill="none" stroke="#F0F3FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Points on ICE -->
  <circle cx="220" cy="238" r="6" fill="#00E5FF" stroke="#FFF" stroke-width="2"/>
  <text x="190" y="265" fill="#00E5FF" font-family="Inter, sans-serif" font-size="11" font-weight="700">Chạm Băng 1</text>

  <circle cx="380" cy="238" r="6" fill="#00E5FF" stroke="#FFF" stroke-width="2"/>
  <text x="350" y="265" fill="#00E5FF" font-family="Inter, sans-serif" font-size="11" font-weight="700">Chạm Băng 2</text>

  <!-- Break of ICE -->
  <circle cx="560" cy="290" r="8" fill="#F23645" stroke="#FFF" stroke-width="2" filter="url(#glowRed)"/>
  <rect x="570" y="280" width="170" height="55" rx="6" fill="#2A1418" stroke="#F23645" stroke-width="1.5"/>
  <text x="580" y="300" fill="#F23645" font-family="Inter, sans-serif" font-size="12" font-weight="800">CÚ PHÁ BĂNG (BREAK OF ICE)</text>
  <text x="580" y="322" fill="#CAD4E0" font-family="Inter, sans-serif" font-size="11">Vol bán bùng nổ (SOW)</text>

  <!-- Back to ICE / LPSY -->
  <circle cx="740" cy="244" r="8" fill="#F0B90B" stroke="#FFF" stroke-width="2"/>
  <rect x="680" y="135" width="220" height="80" rx="8" fill="#1A2130" stroke="#F0B90B" stroke-width="2"/>
  <text x="695" y="160" fill="#F0B90B" font-family="Inter, sans-serif" font-size="13" font-weight="800">ĐIỂM LPSY (LAST POINT OF SUPPLY)</text>
  <text x="695" y="182" fill="#CAD4E0" font-family="Inter, sans-serif" font-size="11">Hồi kỹ thuật test lại mép băng</text>
  <text x="695" y="200" fill="#00E5FF" font-family="Inter, sans-serif" font-size="11">Volume cực thấp (No Demand) &rarr; SELL</text>

  <!-- Markdown Plunge Arrow -->
  <line x1="810" y1="320" x2="910" y2="470" stroke="#F23645" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <text x="840" y="390" fill="#F23645" font-family="Inter, sans-serif" font-size="13" font-weight="800">DOWNTREND KHỐC LIỆT</text>

  <!-- 3 Strategic Cards Bottom -->
  <g transform="translate(50, 515)">
    <rect width="280" height="65" rx="8" fill="#182030" stroke="#00E5FF" stroke-width="1"/>
    <text x="15" y="24" fill="#00E5FF" font-family="Inter, sans-serif" font-size="12" font-weight="800">1. KHÁI NIỆM MẶT BĂNG (ICE)</text>
    <text x="15" y="45" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="11">Đường hỗ trợ đỡ giá. Người đi trên băng</text>
    <text x="15" y="58" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="11">càng nhiều lần thì băng càng mỏng và dễ vỡ.</text>
  </g>

  <g transform="translate(355, 515)">
    <rect width="280" height="65" rx="8" fill="#182030" stroke="#F23645" stroke-width="1"/>
    <text x="15" y="24" fill="#F23645" font-family="Inter, sans-serif" font-size="12" font-weight="800">2. XÁC NHẬN PHÁ BĂNG</text>
    <text x="15" y="45" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="11">Thanh nến spread lớn đâm thủng ICE kèm</text>
    <text x="15" y="58" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="11">khối lượng cao &rarr; Lực bán tháo Smart Money.</text>
  </g>

  <g transform="translate(660, 515)">
    <rect width="280" height="65" rx="8" fill="#182030" stroke="#F0B90B" stroke-width="1"/>
    <text x="15" y="24" fill="#F0B90B" font-family="Inter, sans-serif" font-size="12" font-weight="800">3. ĐIỂM SHORT / BÁN THOÁT LPSY</text>
    <text x="15" y="45" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="11">Khi giá ngoi lên test lại mặt băng với Vol teo</text>
    <text x="15" y="58" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="11">tóp &rarr; Điểm bán cắt lỗ/Short tối ưu nhất.</text>
  </g>

  <!-- Watermark -->
  <g transform="translate(830, 575)" opacity="0.55">
    <text x="0" y="0" fill="#8E9BAE" font-family="Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PTvolume.com</text>
  </g>
</svg>