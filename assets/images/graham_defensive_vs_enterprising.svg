<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 920" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="920" fill="url(#bg-canvas)" rx="16"/>
  <rect width="932" height="912" x="4" y="4" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(470, 42)" text-anchor="middle">
    <rect x="-430" y="-24" width="860" height="48" rx="24" fill="#141926" stroke="rgba(0, 229, 255, 0.5)" stroke-width="1.6"/>
    <text y="7" font-size="18.5" font-weight="800" fill="#00E5FF" letter-spacing="0.6">
      MA TRẬN SO SÁNH: PHÒNG THỦ VS. CHỦ ĐỘNG
    </text>
    <text y="40" font-size="13.5" fill="#8E9BAE">
      Chuẩn mực phân loại nhà đầu tư &amp; tiêu chuẩn chọn cổ phiếu của Benjamin Graham
    </text>
  </g>

  <!-- ==================== TABLE CONTAINER ==================== -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <!-- Outer Table Border -->
    <rect width="880" height="745" rx="12" fill="#0E131E" stroke="#222C3E" stroke-width="1.8"/>

    <!-- ==================== TABLE HEADER (Height 55) ==================== -->
    <path d="M 0 12 L 0 55 L 880 55 L 880 12 Q 880 0 868 0 L 12 0 Q 0 0 0 12 Z" fill="#121826"/>
    
    <!-- Col 1 Header: Tiêu chí (Width 180) -->
    <rect x="0" y="0" width="180" height="55" fill="#151D2D" rx="12"/>
    <path d="M 180 0 L 180 55" stroke="#222C3E" stroke-width="1.5"/>
    <text x="90" y="34" font-size="13.5" font-weight="800" fill="#8E9BAE" text-anchor="middle" letter-spacing="0.5">TIÊU CHÍ ĐỐI SÁNH</text>

    <!-- Col 2 Header: Phòng thủ (Width 350) -->
    <rect x="180" y="0" width="350" height="55" fill="#162544"/>
    <path d="M 530 0 L 530 55" stroke="#222C3E" stroke-width="1.5"/>
    <text x="355" y="34" font-size="15" font-weight="800" fill="#00E5FF" text-anchor="middle">
      🛡️ NHÀ ĐẦU TƯ PHÒNG THỦ (DEFENSIVE)
    </text>

    <!-- Col 3 Header: Chủ động (Width 350) -->
    <rect x="530" y="0" width="350" height="55" fill="#102922" rx="12"/>
    <path d="M 530 0 L 530 55" stroke="#222C3E" stroke-width="1.5"/>
    <text x="705" y="34" font-size="15" font-weight="800" fill="#26E7A6" text-anchor="middle">
      ⚡ NHÀ ĐẦU TƯ CHỦ ĐỘNG (ENTERPRISING)
    </text>

    <!-- Vertical Column Grid Lines -->
    <line x1="180" y1="55" x2="180" y2="745" stroke="#1F283A" stroke-width="1.5"/>
    <line x1="530" y1="55" x2="530" y2="745" stroke="#1F283A" stroke-width="1.5"/>

    <!-- ==================== ROW 1: Mục Tiêu (y=55, height 95) ==================== -->
    <rect x="0" y="55" width="880" height="95" fill="#0B101A"/>
    <!-- Col 1 -->
    <text x="20" y="98" font-size="14.5" font-weight="800" fill="#F0B90B">1. Mục Tiêu</text>
    <text x="20" y="120" font-size="12.5" fill="#8E9BAE">Bản chất cốt lõi</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="94" font-size="14.5" font-weight="700" fill="#FFF">• Ưu tiên bảo toàn vốn tuyệt đối.</text>
    <text x="200" y="122" font-size="13.8" fill="#CAD4E0">• Lợi nhuận thỏa đáng, đầu tư an nhàn.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="94" font-size="14.5" font-weight="700" fill="#FFF">• Tối đa hóa tỷ suất sinh lời.</text>
    <text x="550" y="122" font-size="13.8" fill="#26E7A6" font-weight="600">• Đánh bại tỷ suất tăng trưởng của thị trường.</text>
    <line x1="0" y1="150" x2="880" y2="150" stroke="#1A2234" stroke-width="1.2"/>

    <!-- ==================== ROW 2: Tiêu Chuẩn Cổ Phiếu (y=150, height 100) ==================== -->
    <rect x="0" y="150" width="880" height="100" fill="#0D1320"/>
    <!-- Col 1 -->
    <text x="20" y="195" font-size="14.5" font-weight="800" fill="#F0B90B">2. Cổ Phiếu</text>
    <text x="20" y="217" font-size="12.5" fill="#8E9BAE">Tiêu chí lựa chọn</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="188" font-size="14.5" font-weight="700" fill="#00E5FF">• Top đầu ngành, vốn hóa lớn, lâu đời.</text>
    <text x="200" y="216" font-size="13.8" fill="#CAD4E0">• Trả cổ tức liên tục ≥ 20 năm không ngắt.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="188" font-size="14.5" font-weight="700" fill="#26E7A6">• Chiến lược Net-Net (Net Current Assets).</text>
    <text x="550" y="216" font-size="13.8" fill="#CAD4E0">• Thị giá &lt; 2/3 tài sản lưu động sau trừ nợ.</text>
    <line x1="0" y1="250" x2="880" y2="250" stroke="#1A2234" stroke-width="1.2"/>

    <!-- ==================== ROW 3: Sức Khỏe Tài Chính (y=250, height 100) ==================== -->
    <rect x="0" y="250" width="880" height="100" fill="#0B101A"/>
    <!-- Col 1 -->
    <text x="20" y="295" font-size="14.5" font-weight="800" fill="#F0B90B">3. Tài Chính</text>
    <text x="20" y="317" font-size="12.5" fill="#8E9BAE">Sức khỏe &amp; Nợ vay</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="288" font-size="14.5" font-weight="700" fill="#00E5FF">• Khả năng thanh toán: CR ≥ 2.0.</text>
    <text x="200" y="316" font-size="13.8" fill="#CAD4E0">• Nợ dài hạn không vượt vốn lưu động ròng.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="288" font-size="14.5" font-weight="700" fill="#26E7A6">• Định giá chiết khấu sâu 30% - 50%.</text>
    <text x="550" y="316" font-size="13.8" fill="#CAD4E0">• Đệm tài sản vững để hấp thụ rủi ro suy thoái.</text>
    <line x1="0" y1="350" x2="880" y2="350" stroke="#1A2234" stroke-width="1.2"/>

    <!-- ==================== ROW 4: Định Giá & Cơ Hội (y=350, height 100) ==================== -->
    <rect x="0" y="350" width="880" height="100" fill="#0D1320"/>
    <!-- Col 1 -->
    <text x="20" y="395" font-size="14.5" font-weight="800" fill="#F0B90B">4. Định Giá</text>
    <text x="20" y="417" font-size="12.5" fill="#8E9BAE">Công thức &amp; Tình huống</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="388" font-size="14.5" font-weight="800" fill="#F0B90B">• Chỉ số Graham: P/E × P/B ≤ 22.5.</text>
    <text x="200" y="416" font-size="13.8" fill="#CAD4E0">• Tiêu chuẩn khắt khe: P/E ≤ 15 &amp; P/B ≤ 1.5.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="388" font-size="14.5" font-weight="800" fill="#F0B90B">• Mua công ty tốt gặp sự cố ngắn hạn.</text>
    <text x="550" y="416" font-size="13.8" fill="#CAD4E0">• Tận dụng M&amp;A, tái cấu trúc hoặc spin-off.</text>
    <line x1="0" y1="450" x2="880" y2="450" stroke="#1A2234" stroke-width="1.2"/>

    <!-- ==================== ROW 5: Phân Bổ Danh Mục (y=450, height 100) ==================== -->
    <rect x="0" y="450" width="880" height="100" fill="#0B101A"/>
    <!-- Col 1 -->
    <text x="20" y="495" font-size="14.5" font-weight="800" fill="#F0B90B">5. Phân Bổ Vốn</text>
    <text x="20" y="517" font-size="12.5" fill="#8E9BAE">Danh mục &amp; Vào lệnh</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="488" font-size="14.5" font-weight="700" fill="#00E5FF">• 50% Trái phiếu/Tiết kiệm + 50% Cổ phiếu.</text>
    <text x="200" y="516" font-size="13.8" fill="#CAD4E0">• Mua tích sản định kỳ (DCA) quỹ chỉ số ETF.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="488" font-size="14.5" font-weight="700" fill="#26E7A6">• Danh mục chọn lọc tập trung 10 - 25 mã.</text>
    <text x="550" y="516" font-size="13.8" fill="#CAD4E0">• Kết hợp điểm Spring VSA cạn kiệt Volume.</text>
    <line x1="0" y1="550" x2="880" y2="550" stroke="#1A2234" stroke-width="1.2"/>

    <!-- ==================== ROW 6: Thời Gian & Công Sức (y=550, height 95) ==================== -->
    <rect x="0" y="550" width="880" height="95" fill="#0D1320"/>
    <!-- Col 1 -->
    <text x="20" y="595" font-size="14.5" font-weight="800" fill="#F0B90B">6. Thời Gian</text>
    <text x="20" y="617" font-size="12.5" fill="#8E9BAE">Nỗ lực theo dõi</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="588" font-size="14.5" font-weight="800" fill="#26E7A6">• Chỉ 1 - 2 giờ / tháng (Rất nhàn).</text>
    <text x="200" y="616" font-size="13.8" fill="#CAD4E0">• Phù hợp với người bận rộn nhiều công việc.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="588" font-size="14.5" font-weight="800" fill="#FF5252">• 15 - 25 giờ / tuần (Nghiên cứu sâu).</text>
    <text x="550" y="616" font-size="13.8" fill="#CAD4E0">• Bắt buộc đọc BCTC và bám sát chu kỳ vĩ mô.</text>
    <line x1="0" y1="645" x2="880" y2="645" stroke="#1A2234" stroke-width="1.2"/>

    <!-- ==================== ROW 7: Nguy Cơ Lớn Nhất (y=645, height 100) ==================== -->
    <path d="M 0 645 L 0 733 Q 0 745 12 745 L 868 745 Q 880 745 880 733 L 880 645 Z" fill="#0B101A"/>
    <!-- Col 1 -->
    <text x="20" y="688" font-size="14.5" font-weight="800" fill="#FF5252">7. Nguy Cơ</text>
    <text x="20" y="710" font-size="12.5" fill="#8E9BAE">Cạm bẫy sống còn</text>
    <!-- Col 2 (Defensive) -->
    <text x="200" y="682" font-size="14.5" font-weight="700" fill="#FF5252">• Thiếu kiên nhẫn, bị lòng tham cám dỗ.</text>
    <text x="200" y="710" font-size="13.8" fill="#CAD4E0">• Bỏ kỷ luật nhảy sang lướt sóng rồi thua lỗ.</text>
    <!-- Col 3 (Enterprising) -->
    <text x="550" y="682" font-size="14.5" font-weight="700" fill="#FF5252">• Ảo tưởng năng lực, phân tích sai.</text>
    <text x="550" y="710" font-size="13.8" fill="#CAD4E0">• Làm chủ động nửa vời biến thành con mồi.</text>
  </g>

  <!-- ==================== BOTTOM BANNER ==================== -->
  <g transform="translate(30, 855)">
    <rect width="880" height="50" rx="8" fill="#141926" stroke="rgba(240, 185, 11, 0.45)" stroke-width="1.4"/>
    <text x="440" y="21" font-size="13" fill="#CAD4E0" text-anchor="middle">
      <tspan fill="#F0B90B" font-weight="800">Lời khuyên của Graham:</tspan> "Làm một nhà đầu tư phòng thủ kiên định luôn an toàn và vượt trội"
    </text>
    <text x="440" y="39" font-size="13" fill="#CAD4E0" text-anchor="middle">
      "hơn rất nhiều so với một nhà đầu tư chủ động nửa vời chạy theo đám đông."
    </text>
  </g>
</svg>
