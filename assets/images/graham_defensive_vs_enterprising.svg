<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1000" width="100%" height="100%" style="background:#0B0E14; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <linearGradient id="defensive-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16233B" />
      <stop offset="100%" stop-color="#0D1524" />
    </linearGradient>
    <linearGradient id="enterprising-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122B24" />
      <stop offset="100%" stop-color="#091814" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="1000" fill="url(#bg-canvas)" rx="16"/>
  <rect width="912" height="992" x="4" y="4" fill="none" stroke="#222938" stroke-width="2" rx="14"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(460, 42)" text-anchor="middle">
    <rect x="-420" y="-24" width="840" height="48" rx="24" fill="#141926" stroke="rgba(0, 229, 255, 0.5)" stroke-width="1.6"/>
    <text y="7" font-size="18.5" font-weight="800" fill="#00E5FF" letter-spacing="0.6">
      SO SÁNH: NHÀ ĐẦU TƯ PHÒNG THỦ VS. CHỦ ĐỘNG
    </text>
    <text y="42" font-size="13.5" fill="#8E9BAE">
      Bộ tiêu chuẩn lọc cổ phiếu và phân bổ danh mục theo trường phái Benjamin Graham
    </text>
  </g>

  <!-- ==================== COLUMN 1: DEFENSIVE INVESTOR ==================== -->
  <g transform="translate(30, 105)" filter="url(#shadow)">
    <rect width="415" height="805" rx="14" fill="url(#defensive-card)" stroke="#2962FF" stroke-width="2"/>
    <rect width="415" height="50" rx="14" fill="#2962FF"/>
    <path d="M 0 35 L 0 50 L 415 50 L 415 35 Z" fill="#2962FF"/>
    <text x="207" y="32" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      🛡️ NHÀ ĐẦU TƯ PHÒNG THỦ
    </text>

    <!-- Subtitle -->
    <text x="20" y="78" font-size="13.5" fill="#CAD4E0" font-weight="600">
      Mục tiêu: <tspan fill="#00E5FF">Bảo toàn vốn, rất nhàn rỗi</tspan>
    </text>

    <!-- 5 Criteria Boxes (Height 82px each) -->
    <g transform="translate(18, 95)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="379" height="78" rx="8" fill="#0D1424" stroke="#1D2E4E"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#00E5FF">1. Quy mô &amp; Vị thế doanh nghiệp</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Thuộc Top đầu ngành, vốn hóa lớn.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Thương hiệu lâu đời, thị phần vững.</text>

      <!-- Item 2 -->
      <rect x="0" y="90" width="379" height="78" rx="8" fill="#0D1424" stroke="#1D2E4E"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#00E5FF">2. Sức khỏe tài chính an toàn</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Thanh toán hiện hành (CR) ≥ 2.0.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Nợ dài hạn không vượt vốn lưu động ròng.</text>

      <!-- Item 3 -->
      <rect x="0" y="180" width="379" height="78" rx="8" fill="#0D1424" stroke="#1D2E4E"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#00E5FF">3. Lịch sử chi trả cổ tức</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Trả cổ tức liên tục ≥ 20 năm gần nhất.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Ưu tiên cổ tức tiền mặt đều đặn.</text>

      <!-- Item 4 -->
      <rect x="0" y="270" width="379" height="78" rx="8" fill="#0D1424" stroke="#1D2E4E"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#00E5FF">4. Tăng trưởng lợi nhuận EPS</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• EPS tăng trưởng dương 10 năm liên tục.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Tuyệt đối không có năm nào bị lỗ.</text>

      <!-- Item 5 -->
      <rect x="0" y="360" width="379" height="85" rx="8" fill="#0D1424" stroke="#2962FF" stroke-width="1.5"/>
      <text x="14" y="25" font-size="14.5" font-weight="800" fill="#F0B90B">5. Định giá: Chỉ số Graham ≤ 22.5</text>
      <text x="14" y="48" font-size="13.5" fill="#CAD4E0">• P/E ≤ 15 VÀ P/B ≤ 1.5.</text>
      <text x="14" y="68" font-size="13.5" fill="#26E7A6" font-weight="600">• Tích số (P/E × P/B) ≤ 22.5.</text>

      <!-- Summary Box -->
      <g transform="translate(0, 460)">
        <rect width="379" height="215" rx="10" fill="#08101C" stroke="#192A48" stroke-width="1.4"/>
        <rect width="379" height="34" rx="10" fill="#132038"/>
        <path d="M 0 20 L 0 34 L 379 34 L 379 20 Z" fill="#132038"/>
        <text x="14" y="23" font-size="14" font-weight="800" fill="#00E5FF">📌 PHÂN BỔ VỐN &amp; THỜI GIAN:</text>
        
        <text x="14" y="62" font-size="13.8" fill="#CAD4E0">• <tspan fill="#FFF" font-weight="700">Tỷ trọng:</tspan> 50% Trái phiếu + 50% Cổ phiếu.</text>
        <text x="14" y="88" font-size="13.8" fill="#CAD4E0">• <tspan fill="#26E7A6" font-weight="700">Chiến lược:</tspan> Mua tích sản định kỳ (DCA).</text>
        <text x="14" y="114" font-size="13.8" fill="#CAD4E0">• <tspan fill="#00E5FF" font-weight="700">Thời gian:</tspan> 1 - 2 giờ / tháng.</text>
        <text x="14" y="140" font-size="13.8" fill="#CAD4E0">• <tspan fill="#F0B90B" font-weight="700">Lợi nhuận:</tspan> Bám sát chỉ số thị trường.</text>
        <text x="14" y="172" font-size="13" fill="#8E9BAE" font-style="italic">
          → Thảnh thơi, không áp lực bảng điện tử.
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2: ENTERPRISING INVESTOR ==================== -->
  <g transform="translate(475, 105)" filter="url(#shadow)">
    <rect width="415" height="805" rx="14" fill="url(#enterprising-card)" stroke="#089981" stroke-width="2"/>
    <rect width="415" height="50" rx="14" fill="#089981"/>
    <path d="M 0 35 L 0 50 L 415 50 L 415 35 Z" fill="#089981"/>
    <text x="207" y="32" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      ⚡ NHÀ ĐẦU TƯ CHỦ ĐỘNG
    </text>

    <!-- Subtitle -->
    <text x="20" y="78" font-size="13.5" fill="#CAD4E0" font-weight="600">
      Mục tiêu: <tspan fill="#26E7A6">Lợi nhuận vượt trội, đào sâu</tspan>
    </text>

    <!-- 5 Criteria Boxes (Height 82px each) -->
    <g transform="translate(18, 95)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="379" height="78" rx="8" fill="#091612" stroke="#17362C"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#26E7A6">1. Chiến lược Net-Net (NCAV)</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Thị giá &lt; 2/3 Giá trị tài sản lưu động ròng.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Mua công ty rẻ hơn tiền mặt sau trừ nợ.</text>

      <!-- Item 2 -->
      <rect x="0" y="90" width="379" height="78" rx="8" fill="#091612" stroke="#17362C"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#26E7A6">2. Tình huống đặc biệt (Arbitrage)</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Khai thác M&amp;A, tái cơ cấu hoặc spin-off.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Tìm kiếm lợi nhuận từ sự kiện doanh nghiệp.</text>

      <!-- Item 3 -->
      <rect x="0" y="180" width="379" height="78" rx="8" fill="#091612" stroke="#17362C"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#26E7A6">3. Doanh nghiệp tốt gặp sự cố ngắn hạn</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Doanh nghiệp đầu ngành bị bán tháo quá đà.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Nền tảng cốt lõi vẫn hoàn toàn nguyên vẹn.</text>

      <!-- Item 4 -->
      <rect x="0" y="270" width="379" height="78" rx="8" fill="#091612" stroke="#17362C"/>
      <text x="14" y="24" font-size="14.5" font-weight="700" fill="#26E7A6">4. Kết hợp phân tích dòng tiền VSA</text>
      <text x="14" y="46" font-size="13.5" fill="#CAD4E0">• Tìm điểm Spring cạn kiệt thanh khoản.</text>
      <text x="14" y="66" font-size="13.5" fill="#8E9BAE">• Test cung cạn (No Supply) của Smart Money.</text>

      <!-- Item 5 -->
      <rect x="0" y="360" width="379" height="85" rx="8" fill="#091612" stroke="#089981" stroke-width="1.5"/>
      <text x="14" y="25" font-size="14.5" font-weight="800" fill="#00E5FF">5. Danh mục tập trung &amp; Thoát vị thế</text>
      <text x="14" y="48" font-size="13.5" fill="#CAD4E0">• Nắm giữ 10 - 25 mã chọn lọc gắt gao.</text>
      <text x="14" y="68" font-size="13.5" fill="#26E7A6" font-weight="600">• Chốt lời ngay khi thị giá đạt giá trị thực.</text>

      <!-- Summary Box -->
      <g transform="translate(0, 460)">
        <rect width="379" height="215" rx="10" fill="#05120E" stroke="#123228" stroke-width="1.4"/>
        <rect width="379" height="34" rx="10" fill="#0C251D"/>
        <path d="M 0 20 L 0 34 L 379 34 L 379 20 Z" fill="#0C251D"/>
        <text x="14" y="23" font-size="14" font-weight="800" fill="#26E7A6">📌 YÊU CẦU NĂNG LỰC BẮT BUỘC:</text>
        
        <text x="14" y="62" font-size="13.8" fill="#CAD4E0">• <tspan fill="#F0B90B" font-weight="700">Thời gian:</tspan> Tối thiểu 15 - 25 giờ / tuần.</text>
        <text x="14" y="88" font-size="13.8" fill="#CAD4E0">• <tspan fill="#FF5252" font-weight="700">Cảnh báo:</tspan> Đừng làm nửa vời rồi thua lỗ.</text>
        <text x="14" y="114" font-size="13.8" fill="#CAD4E0">• <tspan fill="#00E5FF" font-weight="700">Kỹ năng:</tspan> Đọc thành thạo báo cáo tài chính.</text>
        <text x="14" y="140" font-size="13.8" fill="#CAD4E0">• <tspan fill="#26E7A6" font-weight="700">Kỳ vọng:</tspan> Lợi nhuận cao hơn thị trường.</text>
        <text x="14" y="172" font-size="13" fill="#8E9BAE" font-style="italic">
          → Đòi hỏi sự kỷ luật và chuyên môn cao.
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM FOOTER BAR ==================== -->
  <g transform="translate(30, 930)">
    <rect width="860" height="52" rx="8" fill="#141926" stroke="rgba(240, 185, 11, 0.45)" stroke-width="1.4"/>
    <text x="430" y="22" font-size="13.2" fill="#CAD4E0" text-anchor="middle">
      <tspan fill="#F0B90B" font-weight="800">Lời khuyên của Graham:</tspan> "Hãy thành thật với chính mình. Làm một nhà đầu tư phòng thủ kiên định"
    </text>
    <text x="430" y="42" font-size="13.2" fill="#CAD4E0" text-anchor="middle">
      "luôn an toàn và hiệu quả hơn nhiều so với một nhà đầu tư chủ động nửa vời."
    </text>
  </g>
</svg>
